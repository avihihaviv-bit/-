  }

  /* ================= goals ================= */
  function goalProgress(g) {
    if (g.milestones.length) {
      var done = g.milestones.filter(function (m) { return m.done; }).length;
      return Math.round(done / g.milestones.length * 100);
    }
    return g.manualProgress || 0;
  }

  function goalCardHtml(g) {
    var pct = goalProgress(g);
    var msHtml = g.milestones.map(function (m) {
      return '<li class="ms-item' + (m.done ? ' done' : '') + '">' +
        '<button class="ms-check' + (m.done ? ' done' : '') + '" data-ms-toggle="' + g.id + '|' + m.id + '">' + (m.done ? icon('check') : '') + '</button>' +
        '<span class="ms-title">' + escapeAttr(m.title) + '</span>' +
        '<button class="ms-del" data-ms-del="' + g.id + '|' + m.id + '" aria-label="מחק שלב">' + icon('x') + '</button>' +
      '</li>';
    }).join('');
    return '<div class="card goal-card">' +
      '<div class="goal-head"><h3>' + escapeAttr(g.title) + '</h3><button class="btn-icon" data-goal-del="' + g.id + '" aria-label="מחק יעד">' + icon('trash') + '</button></div>' +
      (g.targetDate ? '<div class="page-sub" style="margin-bottom:10px;">יעד ל-<span dir="ltr">' + g.targetDate + '</span></div>' : '') +
      '<div class="goal-progress-row"><div class="balance-track" style="flex:1;"><div class="balance-fill" style="width:' + pct + '%;background:var(--accent);"></div></div><span class="num" style="font-weight:700;min-width:38px;">' + pct + '%</span></div>' +
      (g.milestones.length ? '<ul class="ms-list">' + msHtml + '</ul>' : '') +
      '<div class="ms-add-row"><input type="text" class="ms-input" data-ms-input="' + g.id + '" maxlength="60" placeholder="הוסף שלב..."><button class="btn btn-ghost btn-sm" data-ms-add="' + g.id + '" aria-label="הוסף שלב">' + icon('plus') + '</button></div>' +
      (!g.milestones.length ? '<div class="goal-manual-row" style="margin-top:10px;"><span>התקדמות ידנית</span><input type="range" min="0" max="100" value="' + (g.manualProgress || 0) + '" data-manual-progress="' + g.id + '"></div>' : '') +
    '</div>';
  }

  function renderGoals() {
    var el = document.getElementById('panel-goals');
    el.innerHTML =
      '<div class="page-head"><div><h2 class="page-title">יעדים</h2><p class="page-sub">יעדים ארוכי טווח, מפורקים לשלבים קטנים</p></div>' +
        '<button class="btn btn-primary" id="add-goal-btn">' + icon('plus') + 'יעד' + '</button></div>' +
      (state.goals.length ? state.goals.map(goalCardHtml).join('') : '<p class="empty-msg">אין עדיין יעדים. תתחיל מאחד.</p>');

    document.getElementById('add-goal-btn').addEventListener('click', openNewGoalModal);
    Array.prototype.forEach.call(el.querySelectorAll('[data-goal-del]'), function (b) {
      b.addEventListener('click', function () {
        openConfirmModal('למחוק את היעד הזה?', function () {
          state.goals = state.goals.filter(function (g) { return g.id !== b.dataset.goalDel; });
          saveState(); renderGoals();
        });
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-ms-toggle]'), function (b) {
      b.addEventListener('click', function () {
        var parts = b.dataset.msToggle.split('|');
        var g = state.goals.find(function (x) { return x.id === parts[0]; });
        var m = g && g.milestones.find(function (x) { return x.id === parts[1]; });
        if (m) m.done = !m.done;
        saveState(); renderGoals();
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-ms-del]'), function (b) {
      b.addEventListener('click', function () {
        var parts = b.dataset.msDel.split('|');
        var g = state.goals.find(function (x) { return x.id === parts[0]; });
        if (g) g.milestones = g.milestones.filter(function (x) { return x.id !== parts[1]; });
        saveState(); renderGoals();
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-ms-add]'), function (b) {
      var addFn = function () {
        var input = el.querySelector('[data-ms-input="' + b.dataset.msAdd + '"]');
        var title = input.value.trim();
        if (!title) return;
        var g = state.goals.find(function (x) { return x.id === b.dataset.msAdd; });
        if (g) g.milestones.push({ id: uid(), title: title, done: false });
        saveState(); renderGoals();
      };
      b.addEventListener('click', addFn);
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-ms-input]'), function (inp) {
      inp.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        el.querySelector('[data-ms-add="' + inp.dataset.msInput + '"]').click();
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-manual-progress]'), function (rng) {
      rng.addEventListener('input', function () {
        var g = state.goals.find(function (x) { return x.id === rng.dataset.manualProgress; });
        if (g) g.manualProgress = +rng.value;
        var row = rng.closest('.goal-card');
        row.querySelector('.balance-fill').style.width = rng.value + '%';
        row.querySelector('.goal-progress-row .num').textContent = rng.value + '%';
      });
      rng.addEventListener('change', function () { saveState(); });
    });
  }

  function openNewGoalModal() {
    var root = document.getElementById('modal-root');
    var wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.addEventListener('click', function (e) { if (e.target === wrap) closeModal(); });
    wrap.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<h3>יעד חדש</h3>' +
        '<div class="field" style="margin-bottom:12px;"><label>מה היעד?</label><input type="text" id="new-goal-title" maxlength="60" placeholder="למשל: ללמוד Python"></div>' +
        '<div class="field" style="margin-bottom:16px;"><label>תאריך יעד (אופציונלי)</label><input type="date" id="new-goal-date"></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-primary btn-block" id="new-goal-save">' + icon('check') + 'צור' + '</button>' +
          '<button class="btn btn-ghost" id="new-goal-cancel">' + icon('x') + '</button>' +
        '</div>' +
      '</div>';
    root.innerHTML = '';
    root.appendChild(wrap);
    document.getElementById('new-goal-cancel').addEventListener('click', closeModal);
    document.getElementById('new-goal-title').focus();
    document.getElementById('new-goal-save').addEventListener('click', function () {
      var titleInput = document.getElementById('new-goal-title');
      var title = titleInput.value.trim();
      if (!title) { titleInput.focus(); return; }
      var date = document.getElementById('new-goal-date').value || null;
      state.goals.push({ id: uid(), title: title, targetDate: date, milestones: [], manualProgress: 0 });
      saveState();
      closeModal();
      renderGoals();
      toast('היעד נוסף');
    });
  }

  /* ================= money ================= */
  function moneyBalance() {
    return state.money.entries.reduce(function (sum, e) { return sum + (e.type === 'income' ? e.amount : -e.amount); }, 0);
  }
  function moneyMonthlyNet() {
    var ym = dkey(todayDate()).slice(0, 7);
    return state.money.entries.filter(function (e) { return e.date.slice(0, 7) === ym; })
      .reduce(function (sum, e) { return sum + (e.type === 'income' ? e.amount : -e.amount); }, 0);
  }
  function moneyEntryHtml(e) {
    var catList = e.type === 'income' ? INCOME_CATS : MONEY_CATS;
    var cat = catList.filter(function (c) { return c.id === e.category; })[0];
    var label = e.note || (cat ? cat.label : (e.type === 'income' ? 'הכנסה' : 'הוצאה'));
    return '<li class="money-entry">' +
      '<span class="em">' + (cat ? cat.emoji : (e.type === 'income' ? '💰' : '📦')) + '</span>' +
      '<div class="mt"><div>' + escapeAttr(label) + '</div><div class="cat" dir="ltr">' + e.date + (cat && e.note ? ' · ' + cat.label : '') + '</div></div>' +
      '<span class="amt num ' + e.type + '" dir="ltr">' + (e.type === 'income' ? '+' : '-') + '₪' + e.amount.toLocaleString('he-IL') + '</span>' +
      '<button class="m-del" data-money-del="' + e.id + '" aria-label="מחק">' + icon('x') + '</button>' +
    '</li>';
  }

  function renderMoney() {
    var el = document.getElementById('panel-money');
    var balance = moneyBalance();
    var monthNet = moneyMonthlyNet();
    var recent = state.money.entries.slice().sort(function (a, b) { return b.date.localeCompare(a.date); }).slice(0, 12);
    var sgs = state.money.savingsGoals;

    el.innerHTML =
      '<div class="page-head"><div><h2 class="page-title">כסף</h2><p class="page-sub">מעקב פשוט אחר הכנסות והוצאות</p></div></div>' +
      '<div class="card" style="margin-bottom:16px;">' +
        '<div class="money-summary"><span class="page-sub">יתרה כוללת</span></div>' +
        '<div class="money-balance num" dir="ltr">' + (balance < 0 ? '-' : '') + '₪' + Math.abs(balance).toLocaleString('he-IL') + '</div>' +
        '<div class="money-sub"><span>החודש: <b class="num" dir="ltr">' + (monthNet < 0 ? '-' : '+') + '₪' + Math.abs(monthNet).toLocaleString('he-IL') + '</b></span></div>' +
        '<div class="money-add-row">' +
          '<button class="btn btn-primary btn-block" id="add-income-btn">' + icon('plus') + 'הכנסה' + '</button>' +
          '<button class="btn btn-ghost btn-block" id="add-expense-btn">' + icon('plus') + 'הוצאה' + '</button>' +
        '</div>' +
      '</div>' +
      '<div class="card" style="margin-bottom:16px;">' +
        '<div class="goal-head" style="margin-bottom:' + (sgs.length ? '12' : '0') + 'px;"><h3 style="margin:0;">יעדי חיסכון</h3><button class="btn btn-ghost btn-sm" id="new-savings-btn">' + icon('plus') + 'יעד חדש' + '</button></div>' +
        (sgs.length ? sgs.map(function (sg, i) {
          var last = i === sgs.length - 1;
          return '<div style="' + (last ? '' : 'margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);') + '">' +
            '<div class="goal-head" style="margin-bottom:6px;"><div style="font-weight:600;">' + escapeAttr(sg.title) + '</div><button class="btn-icon" data-del-savings="' + sg.id + '" aria-label="מחק יעד חיסכון">' + icon('trash') + '</button></div>' +
            '<div class="goal-progress-row"><div class="balance-track" style="flex:1;"><div class="balance-fill" style="width:' + Math.min(100, Math.round(sg.current / sg.target * 100)) + '%;background:var(--accent-2);"></div></div><span class="num" style="font-weight:700;" dir="ltr">₪' + sg.current.toLocaleString('he-IL') + ' / ₪' + sg.target.toLocaleString('he-IL') + '</span></div>' +
            '<button class="btn btn-ghost btn-sm" data-add-to-savings="' + sg.id + '">' + icon('plus') + 'הוסף לחיסכון' + '</button>' +
          '</div>';
        }).join('')
        : '<p class="page-sub" style="margin:0;">עדיין אין יעד חיסכון - אפשר להוסיף כמה שרוצים.</p>') +
      '</div>' +
      '<div class="card" style="margin-bottom:16px;">' +
        '<h3 style="margin-bottom:10px;">💡 רעיונות עסק</h3>' +
        (state.money.ideas.length ? '<ul class="ms-list">' + state.money.ideas.map(function (idea) {
          return '<li class="ms-item"><span class="ms-title">' + escapeAttr(idea.title) + '</span><button class="ms-del" data-idea-del="' + idea.id + '" aria-label="מחק רעיון">' + icon('x') + '</button></li>';
        }).join('') + '</ul>' : '<p class="page-sub" style="margin-bottom:10px;">עדיין אין רעיונות - תוסיף את הראשון.</p>') +
        '<div class="ms-add-row"><input type="text" class="ms-input" id="idea-input" maxlength="80" placeholder="למשל: חנות אונליין לנעליים"><button class="btn btn-ghost btn-sm" id="idea-add-btn">' + icon('plus') + '</button></div>' +
      '</div>' +
      '<div class="card">' +
        '<h3 style="margin-bottom:10px;">תנועות אחרונות</h3>' +
        (recent.length ? '<ul class="money-entries">' + recent.map(moneyEntryHtml).join('') + '</ul>' : '<p class="empty-msg" style="padding:14px 0;">אין עדיין תנועות.</p>') +
      '</div>';

    var ideaAddBtn = document.getElementById('idea-add-btn');
    var ideaInput = document.getElementById('idea-input');
    var addIdea = function () {
      var title = ideaInput.value.trim();
      if (!title) return;
      state.money.ideas.push({ id: uid(), title: title });
      saveState();
      renderMoney();
    };
    ideaAddBtn.addEventListener('click', addIdea);
    ideaInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addIdea(); } });
    Array.prototype.forEach.call(el.querySelectorAll('[data-idea-del]'), function (b) {
      b.addEventListener('click', function () {
        state.money.ideas = state.money.ideas.filter(function (i) { return i.id !== b.dataset.ideaDel; });
        saveState(); renderMoney();
      });
    });

    document.getElementById('add-income-btn').addEventListener('click', function () { openMoneyEntryModal('income'); });
    document.getElementById('add-expense-btn').addEventListener('click', function () { openMoneyEntryModal('expense'); });
    document.getElementById('new-savings-btn').addEventListener('click', openNewSavingsModal);
    Array.prototype.forEach.call(el.querySelectorAll('[data-del-savings]'), function (b) {
      b.addEventListener('click', function () {
        openConfirmModal('למחוק את יעד החיסכון הזה?', function () {
          state.money.savingsGoals = state.money.savingsGoals.filter(function (g) { return g.id !== b.dataset.delSavings; });
          saveState(); renderMoney();
        });
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-add-to-savings]'), function (b) {
      b.addEventListener('click', function () { openAddToSavingsModal(b.dataset.addToSavings); });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-money-del]'), function (b) {
      b.addEventListener('click', function () {
        state.money.entries = state.money.entries.filter(function (e) { return e.id !== b.dataset.moneyDel; });
        saveState(); renderMoney();
      });
    });
  }

    var root = document.getElementById('modal-root');
    var wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.addEventListener('click', function (e) { if (e.target === wrap) closeModal(); });
    var catList = type === 'income' ? INCOME_CATS : MONEY_CATS;
    var catOptions = catList.map(function (c, i) {
      return '<button type="button" class="cat-opt' + (i === 0 ? ' active' : '') + '" data-cat="' + c.id + '">' + c.emoji + ' ' + c.label + '</button>';
    }).join('');
    wrap.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<h3>' + (type === 'income' ? 'הכנסה חדשה' : 'הוצאה חדשה') + '</h3>' +

        '<div class="modal-actions">' +
          '<button class="btn btn-primary btn-block" id="m-save">' + icon('check') + 'שמור' + '</button>' +
          '<button class="btn btn-ghost" id="m-cancel">' + icon('x') + '</button>' +
        '</div>' +
      '</div>';

      b.addEventListener('click', function () {

      });
    });

    document.getElementById('m-amount').focus();

      closeModal();
      renderMoney();
      toast(type === 'income' ? 'הכנסה נוספה' : 'הוצאה נוספה');

      '<div class="modal" role="dialog" aria-modal="true">' +

        '<div class="field" style="margin-bottom:16px;"><label>סכום יעד (₪)</label><input type="number" id="sg-target" min="1" step="1" placeholder="0"></div>' +

          '<button class="btn btn-primary btn-block" id="sg-save">' + icon('check') + 'צור' + '</button>' +
          '<button class="btn btn-ghost" id="sg-cancel">' + icon('x') + '</button>' +
        '</div>' +
      '</div>';
    root.innerHTML = '';

    var wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.addEventListener('click', function (e) { if (e.target === wrap) closeModal(); });
    wrap.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<h3>הוספה לחיסכון</h3>' +
        '<div class="field" style="margin-bottom:16px;"><label>כמה להוסיף (₪)</label><input type="number" id="sg-add-amount" min="0" step="0.1" placeholder="0"></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-primary btn-block" id="sg-add-save">' + icon('check') + 'הוסף' + '</button>' +
          '<button class="btn btn-ghost" id="sg-add-cancel">' + icon('x') + '</button>' +
        '</div>' +
      '</div>';
    root.innerHTML = '';
    root.appendChild(wrap);
    document.getElementById('sg-add-cancel').addEventListener('click', closeModal);
    document.getElementById('sg-add-amount').focus();
    document.getElementById('sg-add-save').addEventListener('click', function () {
      var input = document.getElementById('sg-add-amount');
      var amount = parseFloat(input.value);
      if (!amount || amount <= 0) { input.focus(); return; }
      var goal = state.money.savingsGoals.find(function (g) { return g.id === goalId; });
      if (goal) goal.current += amount;
      saveState();
      closeModal();
      renderMoney();
      toast('נוסף לחיסכון');
    });
  }

  /* ================= learning ================= */
  function simpleListCardHtml(title, emojiLabel, items, idPrefix, placeholder) {
    return '<div class="card" style="margin-bottom:16px;">' +
      '<h3 style="margin-bottom:10px;">' + emojiLabel + ' ' + title + '</h3>' +
      (items.length ? '<ul class="ms-list">' + items.map(function (it) {
        return '<li class="ms-item"><span class="ms-title">' + escapeAttr(it.title) + '</span><button class="ms-del" data-' + idPrefix + '-del="' + it.id + '" aria-label="מחק">' + icon('x') + '</button></li>';
      }).join('') + '</ul>' : '<p class="page-sub" style="margin-bottom:10px;">עדיין ריק - תוסיף את הראשון.</p>') +
      '<div class="ms-add-row"><input type="text" class="ms-input" id="' + idPrefix + '-input" maxlength="80" placeholder="' + escapeAttr(placeholder) + '"><button class="btn btn-ghost btn-sm" id="' + idPrefix + '-add-btn">' + icon('plus') + '</button></div>' +
    '</div>';
  }
  function wireSimpleListSection(el, idPrefix, parentObj, key) {
    var addBtn = document.getElementById(idPrefix + '-add-btn');
    var input = document.getElementById(idPrefix + '-input');
    var add = function () {
      var title = input.value.trim();
      if (!title) return;
      parentObj[key].push({ id: uid(), title: title });
      saveState();
      renderLearning();
    };
    addBtn.addEventListener('click', add);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    Array.prototype.forEach.call(el.querySelectorAll('[data-' + idPrefix + '-del]'), function (b) {
      b.addEventListener('click', function () {
        var delId = b.dataset[idPrefix + 'Del'];
        parentObj[key] = parentObj[key].filter(function (i) { return i.id !== delId; });
        saveState();
        renderLearning();
      });
    });
  }
  function examDaysLeft(dateStr) {
    if (!dateStr) return null;
    var parts = dateStr.split('-');
    var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    d.setHours(0, 0, 0, 0);
    return Math.round((d - todayDate()) / 86400000);
  }
  function examMetaHtml(dateStr) {
    var days = examDaysLeft(dateStr);
    if (days === null) return '<span class="exam-meta">ללא תאריך</span>';
    var cls = days <= 2 ? 'urgent' : (days <= 7 ? 'soon' : '');
    var label = days < 0 ? 'עבר' : days === 0 ? 'היום' : days === 1 ? 'מחר' : 'עוד <bdi dir="ltr">' + days + '</bdi> ימים';
    return '<span class="exam-meta' + (cls ? ' ' + cls : '') + '">' + label + '</span>';
  }
  function examCardHtml(exams) {
    var sorted = exams.slice().sort(function (a, b) {
      if (!a.date) return 1;
      if (!b.date) return -1;
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });
    return '<div class="card" style="margin-bottom:16px;">' +
      '<h3 style="margin-bottom:10px;">📅 לוח מבחנים</h3>' +
      (sorted.length ? '<ul class="ms-list">' + sorted.map(function (it) {
        return '<li class="ms-item"><span class="ms-title">' + escapeAttr(it.title) +
          (it.date ? ' <span dir="ltr" style="color:var(--text-faint);font-size:12px;">' + it.date + '</span>' : '') + '</span>' +
          examMetaHtml(it.date) +
          '<button class="ms-del" data-exam-del="' + it.id + '" aria-label="מחק">' + icon('x') + '</button></li>';
      }).join('') + '</ul>' : '<p class="page-sub" style="margin-bottom:10px;">אין מבחנים קרובים - תוסיף אחד.</p>') +
      '<div class="exam-add-row">' +
        '<input type="text" class="ms-input" id="exam-input" maxlength="60" placeholder="למשל: מבחן במתמטיקה">' +
        '<input type="date" id="exam-date-input">' +
        '<button class="btn btn-ghost btn-sm" id="exam-add-btn">' + icon('plus') + '</button>' +
      '</div>' +
    '</div>';
  }
  function wireExamSection(el) {
    var addBtn = document.getElementById('exam-add-btn');
    var input = document.getElementById('exam-input');
    var dateInput = document.getElementById('exam-date-input');
    var add = function () {
      var title = input.value.trim();
      if (!title) return;
      state.learning.exams.push({ id: uid(), title: title, date: dateInput.value || null });
      saveState();
      renderLearning();
    };
    addBtn.addEventListener('click', add);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    Array.prototype.forEach.call(el.querySelectorAll('[data-exam-del]'), function (b) {
      b.addEventListener('click', function () {
        state.learning.exams = state.learning.exams.filter(function (i) { return i.id !== b.dataset.examDel; });
        saveState();
        renderLearning();
      });
    });
  }
  function renderLearning() {
    var el = document.getElementById('panel-learning');
    el.innerHTML =
      '<div class="page-head"><div><h2 class="page-title">למידה</h2><p class="page-sub">שיעורי בית, שיטות למידה ולוח מבחנים</p></div></div>' +
      examCardHtml(state.learning.exams) +
      simpleListCardHtml('שיעורי בית', '📚', state.learning.homework, 'hw', 'למשל: תרגילים במתמטיקה עמ׳ 12') +
      simpleListCardHtml('שיטות למידה', '🧠', state.learning.methods, 'method', 'למשל: כרטיסיות זיכרון, פומודורו 25 דק׳');
    wireExamSection(el);
    wireSimpleListSection(el, 'hw', state.learning, 'homework');
    wireSimpleListSection(el, 'method', state.learning, 'methods');
  }

  /* ================= settings ================= */
  function renderSettings() {
    var el = document.getElementById('panel-settings');
    el.innerHTML =
      '<div class="page-head"><div><h2 class="page-title">הגדרות</h2></div></div>' +
      '<div class="card">' +
        '<div class="settings-row"><div><div class="lbl">שם</div><div class="desc">יופיע בברכת הבית</div></div>' +
          '<input type="text" id="set-name" value="' + escapeAttr(state.userName) + '" placeholder="השם שלך" style="max-width:160px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);"></div>' +
        '<div class="settings-row"><div><div class="lbl">ערכת נושא</div><div class="desc">בהיר, כהה או לפי המערכת</div></div>' +
          '<div class="seg">' +
            '<button data-theme-opt="system" class="' + (state.theme === 'system' ? 'active' : '') + '">מערכת</button>' +
            '<button data-theme-opt="light" class="' + (state.theme === 'light' ? 'active' : '') + '">בהיר</button>' +
            '<button data-theme-opt="dark" class="' + (state.theme === 'dark' ? 'active' : '') + '">כהה</button>' +
          '</div></div>' +
        '<div class="settings-row"><div><div class="lbl">ייצוא נתונים</div><div class="desc">כל המידע השמור, לגיבוי או להעברה</div></div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">' +
            '<button class="btn btn-ghost btn-sm" id="export-text-btn">' + icon('edit') + 'הצג טקסט להעתקה' + '</button>' +
          '</div></div>' +
        '<div class="settings-row"><div><div class="lbl">איפוס נתונים</div><div class="desc">מוחק את כל המשימות וההרגלים השמורים</div></div>' +
          '<button class="btn btn-danger btn-sm" id="reset-data">' + icon('trash') + 'איפוס' + '</button></div>' +
      '</div>' +
      '<div class="card" style="margin-top:16px;">' +
        '<h3 style="margin-bottom:4px;">מערכת הרמות</h3>' +
        '<p class="page-sub" style="margin-bottom:14px;">כמה XP כל סוג משימה או בונוס נותן. שינוי כאן לא משפיע על XP שכבר ניתן.</p>' +
        '<div class="xpval-grid">' +
          Object.keys(state.gam.settings.xp).map(function (k) {
            return '<div class="xpval-field"><label>' + XP_FIELD_LABELS[k] + '</label><input type="number" min="0" max="2000" step="1" data-xpval="' + k + '" value="' + state.gam.settings.xp[k] + '"></div>';
          }).join('') +
        '</div>' +
        '<button class="btn btn-ghost btn-sm" id="xpval-reset" style="margin-top:12px;">איפוס לערכי ברירת מחדל</button>' +
      '</div>' +
      '<div class="card" style="margin-top:16px;">' +
        '<div class="settings-row"><div><div class="lbl">צליל בעת XP / הישג</div><div class="desc">צליל עדין קצר, כבוי כברירת מחדל</div></div>' +
          '<label class="switch"><input type="checkbox" id="set-sound"' + (state.gam.settings.sound ? ' checked' : '') + '><span></span></label></div>' +
        '<div class="settings-row"><div><div class="lbl">אנימציות</div><div class="desc">אנימציות XP, Level Up והישגים</div></div>' +
          '<label class="switch"><input type="checkbox" id="set-anim"' + (state.gam.settings.animations ? ' checked' : '') + '><span></span></label></div>' +
        '<div class="settings-row"><div><div class="lbl">חלקיקים (Particles)</div><div class="desc">אפקט פיצוץ חלקיקים ברגעים מיוחדים</div></div>' +
          '<label class="switch"><input type="checkbox" id="set-particles"' + (state.gam.settings.particles ? ' checked' : '') + '><span></span></label></div>' +
        '<div class="settings-row"><div><div class="lbl">הצג XP על משימות</div><div class="desc">תג XP קטן לצד כל פעילות בלוח היומי</div></div>' +
          '<label class="switch"><input type="checkbox" id="set-xpontasks"' + (state.gam.settings.showXPOnTasks ? ' checked' : '') + '><span></span></label></div>' +
        '<div class="settings-row" style="border:none;padding-bottom:0;"><div><div class="lbl">הצג ציון יומי בבית</div><div class="desc">כרטיס ה"ציון היומי" בעמוד הבית</div></div>' +
          '<label class="switch"><input type="checkbox" id="set-statshome"' + (state.gam.settings.showStatsOnHome ? ' checked' : '') + '><span></span></label></div>' +
      '</div>' +
      '<div class="card" style="margin-top:16px;">' +
        '<div class="settings-row" style="border:none;padding:0;"><div><div class="lbl">איפוס נתוני גיימיפיקציה</div><div class="desc">מוחק XP, רמה, רצפים, הישגים ואתגרים - לא נוגע במשימות וביעדים</div></div>' +
          '<button class="btn btn-danger btn-sm" id="reset-gam-data">' + icon('trash') + 'איפוס' + '</button></div>' +
      '</div>';
    document.getElementById('set-name').addEventListener('change', function (e) { state.userName = e.target.value.trim(); saveState(); renderDashboard(); });
    document.getElementById('export-text-btn').addEventListener('click', openExportTextModal);
    Array.prototype.forEach.call(el.querySelectorAll('[data-theme-opt]'), function (b) {
      b.addEventListener('click', function () {
        state.theme = b.dataset.themeOpt; saveState(); applyTheme(); renderSettings();
      });
    });
    document.getElementById('reset-data').addEventListener('click', function () {
      openConfirmModal('לאפס את כל הנתונים השמורים? הפעולה בלתי הפיכה.', function () {
        localStorage.removeItem(STORE_KEY);
        state = loadState();
        applyTheme();
        showPanel('dashboard');
        toast('הנתונים אופסו');
      }, { title: 'איפוס נתונים', confirmLabel: 'איפוס' });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-xpval]'), function (inp) {
      inp.addEventListener('change', function () {
        var v = Math.max(0, Math.min(2000, Math.round(+inp.value) || 0));
        state.gam.settings.xp[inp.dataset.xpval] = v;
        saveState();
        renderDashboard();
      });
    });
    document.getElementById('xpval-reset').addEventListener('click', function () {
      state.gam.settings.xp = defaultXPValues();
      saveState(); renderSettings(); renderDashboard();
      toast('ערכי ה-XP אופסו');
    });
    document.getElementById('set-sound').addEventListener('change', function (e) {
      state.gam.settings.sound = e.target.checked;
      saveState();
    });
    document.getElementById('set-anim').addEventListener('change', function (e) {
      state.gam.settings.animations = e.target.checked;
      saveState();
    });
    document.getElementById('set-particles').addEventListener('change', function (e) {
      state.gam.settings.particles = e.target.checked;
      saveState();
    });
    document.getElementById('set-xpontasks').addEventListener('change', function (e) {
      state.gam.settings.showXPOnTasks = e.target.checked;
      saveState();
      renderSchedule();
    });
    document.getElementById('set-statshome').addEventListener('change', function (e) {
      state.gam.settings.showStatsOnHome = e.target.checked;
      saveState();
      renderDashboard();
    });
    document.getElementById('reset-gam-data').addEventListener('click', function () {
      openConfirmModal('זה ימחק לצמיתות XP, רמה, רצפים, הישגים ואתגרים (המשימות והיעדים שלך יישארו). האם להמשיך?', function () {
        openConfirmModal('אישור אחרון: אין דרך לשחזר את נתוני הגיימיפיקציה לאחר האיפוס. למחוק עכשיו?', function () {
          var keepSettings = state.gam.settings;
          state.gam = {
            totalXP: 0, xpEvents: {}, levelUps: [], dailyBonuses: {}, daySnapshots: {},
            achievements: {}, streak: { current: 0, longest: 0, lastDate: null, log: {} },
            combo: { count: 0, dateKey: null }, challenges: { dayKey: null, weekKey: null, daily: [], weekly: [] },
            cosmetics: { unlocked: [], equipped: { cardStyle: 'premium', barColor: 'default', frame: 'default', title: null } },
            settings: keepSettings
          };
          saveState();
          showPanel('dashboard');
          toast('נתוני הגיימיפיקציה אופסו');
        }, { title: 'אישור אחרון', confirmLabel: 'מחק לצמיתות' });
      }, { title: 'איפוס נתוני גיימיפיקציה', confirmLabel: 'המשך' });
    });
  }

  /* ================= keyboard shortcuts ================= */
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var map = { t: 'schedule', f: 'focus', h: 'habits', g: 'fitness' };
    if (e.key === 'n') { e.preventDefault(); showPanel('schedule'); openTaskModal(null); }
    else if (map[e.key]) { showPanel(map[e.key]); }
    else if (e.key === 'Escape') { closeModal(); }
  });

  /* ================= init ================= */
  applyTheme();
  renderNav();
  gamCheckLevelRewards();
  shopExpirePotions();
  saveState();
  showPanel('dashboard');
  gamFlushEventQueue(null);
  guCheckReminders();
  setInterval(guCheckReminders, 60000);

  var splashEl = document.getElementById('splash');
  if (splashEl) {
    splashEl.addEventListener('click', function () {
      splashEl.style.animation = 'none';
      splashEl.style.opacity = '0';
      splashEl.style.visibility = 'hidden';
      splashEl.style.pointerEvents = 'none';
    });
  }
})();
</script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }</script>
</html>
