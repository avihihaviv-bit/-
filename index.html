<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d121e">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מסלול">
<meta name="mobile-web-app-capable" content="yes">
<title>מסלול</title>
<meta name="description" content="מערכת חיים אישית - לוח יומי, הרגלים, פוקוס וכושר, במקום אחד.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #0d121e;
    --surface: #141b2b;
    --surface-2: #1b2436;
    --surface-3: #232e44;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #eef1f8;
    --text-soft: #8d96b3;
    --text-faint: #5c6483;
    --accent: #45d6c8;
    --accent-ink: #04211d;
    --accent-2: #f5a94e;
    --accent-2-ink: #2b1a04;
    --success: #55cf8f;
    --warning: #f2c14e;
    --danger: #ef6f6a;
    --shadow: rgba(0,0,0,0.45);
    --glass: rgba(255,255,255,0.04);
    --cat-fitness: #d97b78;
    --cat-learning: #7f9bdb;
    --cat-health: #8fbf74;
    --cat-personal: #a98bd0;
    --cat-hobby: #d3ab5f;
    --cat-social: #63b4bb;
    --cat-glowup: #e6a1c7;
    --glow-1: #e6a1c7;
    --glow-2: #f5a94e;
    --radius-s: 8px;
    --radius-m: 14px;
    --radius-l: 20px;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f5fa;
      --surface: #ffffff;
      --surface-2: #eef1f7;
      --surface-3: #e4e8f1;
      --border: rgba(15,20,32,0.08);
      --border-strong: rgba(15,20,32,0.14);
      --text: #14192a;
      --text-soft: #5c6480;
      --text-faint: #9399b3;
      --accent: #0e9c8f;
      --accent-ink: #ffffff;
      --accent-2: #b3771c;
      --accent-2-ink: #ffffff;
      --success: #2f9e63;
      --warning: #a2760c;
      --danger: #c94c46;
      --shadow: rgba(20,25,42,0.12);
      --glass: rgba(255,255,255,0.5);
      --cat-fitness: #c15d59;
      --cat-learning: #5170b8;
      --cat-health: #5c9440;
      --cat-personal: #82609e;
      --cat-hobby: #a97c1f;
      --cat-social: #2f8b92;
      --cat-glowup: #b84e8c;
      --glow-1: #b84e8c;
      --glow-2: #b3771c;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f5fa;
    --surface: #ffffff;
    --surface-2: #eef1f7;
    --surface-3: #e4e8f1;
    --border: rgba(15,20,32,0.08);
    --border-strong: rgba(15,20,32,0.14);
    --text: #14192a;
    --text-soft: #5c6480;
    --text-faint: #9399b3;
    --accent: #0e9c8f;
    --accent-ink: #ffffff;
    --accent-2: #b3771c;
    --accent-2-ink: #ffffff;
    --success: #2f9e63;
    --warning: #a2760c;
    --danger: #c94c46;
    --shadow: rgba(20,25,42,0.12);
    --glass: rgba(255,255,255,0.5);
    --cat-fitness: #c15d59;
    --cat-learning: #5170b8;
    --cat-health: #5c9440;
    --cat-personal: #82609e;
    --cat-hobby: #a97c1f;
    --cat-social: #2f8b92;
    --cat-glowup: #b84e8c;
    --glow-1: #b84e8c;
    --glow-2: #b3771c;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; animation: none !important; } }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Rubik", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .num { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }

  ::selection { background: var(--accent); color: var(--accent-ink); }

  a { color: var(--accent); }

  svg.icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ---------- app shell ---------- */
  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 100vh;
  }
  .main { min-width: 0; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
  }

  .sidebar {
    background: var(--surface);
    border-inline-end: 1px solid var(--border);
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  @media (max-width: 860px) {
    .sidebar { display: none; }
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px 22px;
  }
  .brand-mark {
    width: 32px; height: 32px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 18px; height: 18px; stroke: var(--accent-ink); stroke-width: 2.2; }
  .brand-name { font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: var(--text-soft);
    border-radius: var(--radius-s);
    font-size: 14.5px;
    font-weight: 500;
    cursor: pointer;
    text-align: right;
    transition: background 0.15s var(--ease-out), color 0.15s var(--ease-out), transform 0.1s var(--ease-out);
  }
  .nav-btn:hover { background: var(--surface-2); color: var(--text); }
  .nav-btn:active { transform: scale(0.98); }
  .nav-btn.active { background: var(--surface-2); color: var(--accent); font-weight: 600; }
  .nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .nav-spacer { flex: 1; }
  .nav-foot { font-size: 11.5px; color: var(--text-faint); padding: 10px 12px 0; }

  .bottom-nav {
    display: none;
    position: fixed;
    bottom: 0; inset-inline: 0;
    background: color-mix(in srgb, var(--surface) 86%, transparent);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border-top: 1px solid var(--border);
    box-shadow: 0 -10px 28px -14px var(--shadow);
    padding: 7px 6px calc(7px + env(safe-area-inset-bottom));
    z-index: 30;
  }
  @media (max-width: 860px) { .bottom-nav { display: flex; justify-content: space-around; gap: 2px; } .main { padding-bottom: 82px; } }
  .bottom-nav button {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: none; border: none; color: var(--text-faint);
    font-size: 10.5px; font-weight: 500; padding: 7px 13px; border-radius: 14px; cursor: pointer;
    flex: 1; max-width: 78px;
    transition: color 0.18s var(--ease-out), background-color 0.18s var(--ease-out), transform 0.1s var(--ease-out);
  }
  .bottom-nav button svg { transition: transform 0.2s var(--ease-out); }
  @media (hover: hover) and (pointer: fine) {
    .bottom-nav button:hover { color: var(--text-soft); }
  }
  .bottom-nav button:active { transform: scale(0.9); }
  .bottom-nav button.active {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 13%, transparent);
  }
  .bottom-nav button.active svg { transform: translateY(-1px) scale(1.08); }

  .main { padding: 26px 24px 60px; max-width: 1080px; }
  @media (max-width: 560px) { .main { padding: 18px 14px 60px; } }

  .panel[hidden] { display: none; }
  .panel.panel-enter { animation: panel-in 0.32s var(--ease-out) both; }
  @keyframes panel-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-title { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
  .page-sub { color: var(--text-soft); font-size: 13.5px; margin: 4px 0 0; }

  /* ---------- cards & primitives ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-l);
    padding: 20px;
  }
  .card-tight { padding: 16px; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: var(--radius-s);
    padding: 10px 16px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: transform 0.12s ease, opacity 0.15s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { opacity: 0.9; }
  .btn-ghost { background: var(--surface-2); color: var(--text); }
  .btn-ghost:hover { background: var(--surface-3); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--border-strong); }
  .btn-danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .btn-icon { padding: 8px; border-radius: 50%; background: transparent; color: var(--text-soft); }
  .btn-icon:hover { background: var(--surface-2); color: var(--text); }
  .btn-sm { padding: 7px 12px; font-size: 12.5px; }
  .btn-block { width: 100%; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--text-soft); }
  .field input[type="text"], .field input[type="time"], .field input[type="date"], .field input[type="color"], .field select, .field textarea, .field input[type="number"] {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .field textarea { resize: vertical; min-height: 60px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ---------- dashboard header ---------- */
  .hero {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .hero h1 { font-size: 26px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.01em; }
  .hero .date-line { color: var(--text-soft); font-size: 14px; }
  .clock-chip {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m);
    padding: 10px 18px; text-align: center;
  }
  .clock-chip .time { font-size: 22px; font-weight: 700; }
  .clock-chip .zone { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; }

  /* now card */
  .now-card {
    position: relative;
    background: linear-gradient(135deg, var(--surface-3), var(--surface));
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-l);
    padding: 22px;
    overflow: hidden;
  }
  .now-card::before {
    content: "";
    position: absolute; inset: -40% -20% auto auto; width: 260px; height: 260px;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
    pointer-events: none;
  }
  .now-label { display:flex; align-items:center; gap:7px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .now-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  .now-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; position: relative; }
  .now-time { color: var(--text-soft); font-size: 13.5px; margin-bottom: 16px; position: relative; }
  .now-actions { display: flex; gap: 8px; flex-wrap: wrap; position: relative; }
  .now-empty { color: var(--text-soft); font-size: 14px; }

  .next-later-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .mini-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 13px 15px; }
  .mini-card .lbl { font-size: 10.5px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .mini-card .ttl { font-size: 14.5px; font-weight: 600; }
  .mini-card .tm { font-size: 12px; color: var(--text-soft); }

  /* progress ring */
  .ring-wrap { display: flex; align-items: center; gap: 18px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-track { stroke: var(--surface-3); }
  .ring-fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.6s var(--ease-out); }
  .ring-pct { font-size: 24px; font-weight: 800; }
  .ds-card { display: flex; flex-direction: column; gap: 14px; }
  .ds-head { display: flex; align-items: center; justify-content: space-between; }
  .ds-head h3 { font-size: 15px; }
  .ds-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .ds-badge-great { background: color-mix(in srgb, #34d399 20%, transparent); color: #34d399; }
  .ds-badge-good { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
  .ds-badge-ok { background: color-mix(in srgb, #fbbf24 20%, transparent); color: #fbbf24; }
  .ds-badge-low { background: color-mix(in srgb, #f87171 20%, transparent); color: #f87171; }
  .ds-main { display: flex; align-items: center; gap: 18px; }
  .ds-ring-wrap { position: relative; width: 84px; height: 84px; flex-shrink: 0; }
  .ds-ring-wrap svg { transform: rotate(-90deg); }
  .ds-ring-track { stroke: var(--surface-3); }
  .ds-ring-fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.8s var(--ease-out); }
  .ds-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; }
  .ds-breakdown { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .ds-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-soft); }
  .ds-row b { margin-inline-start: auto; color: var(--text); }
  .ds-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ds-dot-done { background: #34d399; }
  .ds-dot-pending { background: var(--text-soft); opacity: .5; }
  .ds-dot-overdue { background: #f87171; }

  /* ================= Glow Up ================= */
  .gu-title { display: flex; align-items: center; gap: 8px; }
  .gu-title .icon { color: var(--glow-1); }
  .gu-tabs { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
  .gu-tabs::-webkit-scrollbar { display: none; }
  .gu-tabs button { flex-shrink: 0; }
  .gu-hero-card { background: linear-gradient(135deg, color-mix(in srgb, var(--glow-1) 16%, var(--surface-2)), color-mix(in srgb, var(--glow-2) 10%, var(--surface-2))); margin-bottom: 14px; }
  .gu-hero-quote { font-size: 14px; font-weight: 600; font-style: italic; color: var(--text); margin-bottom: 14px; }
  .gu-hero-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .gu-hero-stats { grid-template-columns: repeat(3, 1fr); } }
  .gu-hero-stat { background: var(--surface); border-radius: var(--radius-s); padding: 10px; text-align: center; }
  .gu-hero-stat .v { font-size: 17px; font-weight: 800; }
  .gu-hero-stat .l { font-size: 10.5px; color: var(--text-soft); margin-top: 2px; }
  .gu-quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .gu-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .gu-card-head h3 { font-size: 15px; }
  .gu-plan-list { display: flex; flex-direction: column; gap: 8px; }
  .gu-plan-item { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: var(--radius-s); padding: 9px 11px; transition: opacity 0.2s var(--ease-out); }
  .gu-plan-item.done { opacity: 0.55; }
  .gu-plan-text { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
  .gu-plan-title { font-size: 13.5px; font-weight: 600; }
  .gu-plan-item.done .gu-plan-title { text-decoration: line-through; }
  .gu-plan-sub { font-size: 11px; color: var(--text-soft); }
  .gu-add-row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .gu-toolbar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .gu-toolbar .ach-search { width: 100%; }
  .gu-toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .gu-toolbar-actions-left { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .gu-sort-select { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-s); padding: 7px 9px; color: var(--text); font-size: 12.5px; }
  .gu-ex-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .gu-ex-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 980px) { .gu-ex-grid { grid-template-columns: repeat(3, 1fr); } }
  .gu-ex-card { position: relative; cursor: pointer; transition: transform 0.18s var(--ease-out), border-color 0.18s var(--ease-out); }
  .gu-ex-card:hover { transform: translateY(-2px); border-color: var(--border-strong); }
  .gu-ex-name { font-weight: 700; font-size: 14.5px; margin-bottom: 4px; padding-inline-end: 30px; }
  .gu-ex-cats { font-size: 11px; color: var(--text-soft); margin-bottom: 6px; }
  .gu-ex-desc { font-size: 12.5px; color: var(--text-soft); margin-bottom: 8px; }
  .gu-ex-meta { display: flex; gap: 10px; font-size: 11px; color: var(--text-faint); margin-bottom: 10px; }
  .gu-ex-actions { display: flex; gap: 6px; align-items: center; }
  .gu-ex-actions .btn-primary.done { background: var(--success); }
  .gu-ex-list { display: flex; flex-direction: column; gap: 8px; }
  .gu-ex-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 10px 12px; cursor: pointer; }
  .gu-ex-row-name { font-weight: 600; font-size: 13.5px; flex: 1; }
  .gu-ex-row-cats { font-size: 11px; color: var(--text-soft); }
  .gu-fav-btn { position: absolute; top: 10px; left: 10px; background: none; border: none; color: var(--text-faint); cursor: pointer; padding: 2px; display: flex; }
  .gu-fav-btn .icon { width: 17px; height: 17px; }
  .gu-fav-btn.active { color: var(--glow-2); }
  .gu-fav-btn.active .icon { fill: var(--glow-2); }
  .gu-cat-check-grid { display: flex; flex-wrap: wrap; gap: 6px; max-height: 118px; overflow-y: auto; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-s); background: var(--surface-2); align-content: flex-start; }
  .gu-cat-check { display: flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 6px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-soft); cursor: pointer; }
  .gu-cat-check input { accent-color: var(--accent); }
  .gu-cat-check.active { border-color: var(--accent); color: var(--text); background: color-mix(in srgb, var(--accent) 14%, var(--surface-2)); }
  .gu-tip-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .gu-tip-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 980px) { .gu-tip-grid { grid-template-columns: repeat(3, 1fr); } }
  .gu-tip-card { position: relative; cursor: pointer; transition: transform 0.18s var(--ease-out); }
  .gu-tip-card:hover { transform: translateY(-2px); }
  .gu-tip-status { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-3); color: var(--text-soft); margin-bottom: 8px; }
  .gu-tip-status-useful, .gu-watch-applied { background: color-mix(in srgb, var(--success) 22%, transparent); color: var(--success); }
  .gu-tip-status-tried, .gu-watch-watched_saved_tips { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }
  .gu-watch-watched { background: color-mix(in srgb, var(--warning) 20%, transparent); color: var(--warning); }
  .gu-tip-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; padding-inline-end: 26px; }
  .gu-tip-content { font-size: 12.5px; color: var(--text-soft); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .gu-tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .gu-tag { font-size: 10.5px; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); padding: 2px 7px; border-radius: 999px; }
  .gu-video-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }

  @media (min-width: 980px) { .gu-video-grid { grid-template-columns: repeat(3, 1fr); } }
  .gu-video-card { position: relative; }
  .gu-video-thumb { background: var(--surface-3); border-radius: var(--radius-s); height: 90px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-bottom: 8px; position: relative; }
  .gu-video-play-ic { width: 26px; height: 26px; color: var(--text-soft); }
  .gu-video-platform { position: absolute; bottom: 6px; inset-inline-end: 8px; font-size: 10px; color: var(--text-faint); background: var(--surface); padding: 2px 7px; border-radius: 999px; }
  .gu-video-title { font-weight: 700; font-size: 13.5px; cursor: pointer; margin-bottom: 2px; padding-inline-end: 26px; }
  .gu-video-domain { font-size: 11px; color: var(--text-faint); margin-bottom: 8px; direction: ltr; text-align: right; }
  .gu-video-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .gu-routine-card { margin-bottom: 14px; }
  .gu-routine-head-actions { display: flex; gap: 4px; }
  .gu-paused-tag { font-size: 10.5px; color: var(--warning); font-weight: 600; }
  .gu-optional-tag { font-size: 10px; color: var(--text-faint); }
  .gu-routine-items { display: flex; flex-direction: column; gap: 6px; }
  .gu-focus-card { text-align: center; padding: 32px 20px; }
  .gu-focus-progress { margin-bottom: 24px; }
  .gu-focus-progress .page-sub { margin-top: 6px; }
  .gu-focus-title { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  .gu-focus-duration { color: var(--text-soft); font-size: 14px; }
  .gu-focus-done { text-align: center; padding: 40px 20px; }
  .gu-focus-done-ic { color: var(--glow-2); margin-bottom: 14px; }
  .gu-focus-done-ic .icon { width: 44px; height: 44px; }
  .gu-journal-card { margin-bottom: 14px; }
  .gu-detail-block { margin-bottom: 12px; }
  .gu-detail-block b { display: block; font-size: 12px; color: var(--text-soft); margin-bottom: 3px; }
  .gu-detail-block p { font-size: 13.5px; white-space: pre-wrap; }
  .gu-detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; font-size: 12.5px; }
  .gu-detail-grid div { display: flex; flex-direction: column; gap: 2px; background: var(--surface-2); border-radius: var(--radius-s); padding: 7px 9px; }
  .gu-detail-grid b { font-size: 10.5px; color: var(--text-soft); }
  .gu-history-list { font-size: 12.5px; color: var(--text-soft); margin-top: 6px; padding-inline-start: 18px; }
  .gu-cat-manage-list { display: flex; flex-direction: column; gap: 8px; }
  .gu-cat-manage-row { display: flex; align-items: center; gap: 12px; }
  .gu-cat-hidden { opacity: 0.5; }
  .gu-cat-emoji { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .gu-cat-manage-info { flex: 1; min-width: 0; }
  .gu-cat-manage-name { font-weight: 700; font-size: 13.5px; }
  .gu-cat-manage-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .gu-cat-reorder { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .gu-cat-reorder button { width: 26px; height: 19px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--text-faint); font-size: 11px; line-height: 1; }
  .gu-cat-reorder button:first-child { border-bottom: 1px solid var(--border); }
  .gu-cat-reorder button:disabled { opacity: 0.3; }
  .gu-cat-main-actions { display: flex; gap: 2px; }
  .gu-reminder-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); }
  .gu-reminder-info { display: flex; flex-direction: column; gap: 2px; }
  .gu-reminder-actions { display: flex; gap: 4px; }
  .gu-modal { max-width: 480px; }
  @media (prefers-reduced-motion: reduce) { .gu-ex-card:hover, .gu-tip-card:hover { transform: none; } }
  .stat-list { display: flex; flex-direction: column; gap: 6px; }
  .stat-list .row { display: flex; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--text-soft); min-width: 150px; }
  .stat-list .row b { color: var(--text); font-weight: 600; }

  /* life balance */
  .balance-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .balance-row:last-child { margin-bottom: 0; }
  .balance-label { width: 108px; flex-shrink: 0; color: var(--text-soft); display: flex; align-items: center; gap: 6px; }
  .balance-track { flex: 1; height: 7px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
  .balance-fill { height: 100%; border-radius: 4px; transition: width 0.6s var(--ease-out); }
  .balance-val { width: 34px; text-align: left; color: var(--text-faint); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* schedule */
  .day-switch { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .day-pill { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); font-size: 13px; font-weight: 600; cursor: pointer; }
  .day-pill.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .day-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .day-pill-add { background: transparent; border-style: dashed; color: var(--text-faint); }
  .day-pill-add:hover { color: var(--accent); border-color: var(--accent); }
  .day-pill-wrap { position: relative; display: inline-block; }
  .day-pill-del {
    position: absolute; top: -7px; left: -7px; width: 19px; height: 19px; border-radius: 50%;
    border: 2px solid var(--surface); background: var(--danger); color: #fff; font-size: 12px; line-height: 1; padding: 0;
    cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 1;
    box-shadow: 0 1px 3px var(--shadow); z-index: 1;
  }
  .day-pill-del:hover { transform: scale(1.1); }

  .timeline { position: relative; padding-inline-start: 20px; }
  .timeline::before { content: ""; position: absolute; inset-inline-start: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
  .t-item { position: relative; padding: 0 0 18px 16px; margin-inline-start: 0; }
  .t-item:last-child { padding-bottom: 0; }
  .t-item.dragging { opacity: 0.35; }
  .t-item.drop-indicator { padding: 0; margin: -3px 0 15px 16px; height: 3px; border-radius: 2px; background: var(--accent); list-style: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .drag-handle {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 6px; border: none; background: transparent;
    color: var(--text-faint); cursor: grab; display: flex; align-items: center; justify-content: center;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  .drag-handle:hover { background: var(--surface-2); color: var(--text-soft); }
  .drag-handle:active { cursor: grabbing; }
  .t-item::before {
    content: ""; position: absolute; inset-inline-start: -19px; top: 4px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--cat, var(--accent));
  }
  .t-item.done::before { background: var(--cat, var(--accent)); }
  .t-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 11px 14px; cursor: pointer; transition: border-color 0.15s var(--ease-out), transform 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out); }
  @media (hover: hover) and (pointer: fine) {
    .t-row:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: 0 4px 14px -8px var(--shadow); }
  }
  .t-row:active { transform: scale(0.99); }
  .t-row.now { border-color: var(--cat, var(--accent)); box-shadow: 0 0 0 1px var(--cat, var(--accent)) inset; }
  .t-check { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border-strong); flex-shrink: 0; cursor: pointer; background: transparent; position: relative; }
  .t-check.done { background: var(--cat, var(--accent)); border-color: var(--cat, var(--accent)); }
  .t-check.done::after { content: ""; position: absolute; inset: 0; margin: auto; width: 5px; height: 9px; border-bottom: 2px solid var(--accent-ink); border-inline-end: 2px solid var(--accent-ink); transform: rotate(35deg) translate(-1px,-2px); }
  .t-time { font-size: 12px; color: var(--text-soft); flex: 0 0 42px; }
  .t-title { flex: 1; font-size: 14.5px; font-weight: 500; }
  .t-row.done .t-title { text-decoration: line-through; color: var(--text-faint); }
  .t-cat-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cat, var(--accent)); flex-shrink: 0; }
  .t-xp-badge { font-size: 10.5px; color: var(--accent); font-family: "JetBrains Mono", monospace; flex-shrink: 0; opacity: .8; }
  .empty-msg { text-align: center; color: var(--text-soft); padding: 30px 0; font-size: 14px; }

  /* habits */
  .habit-card { display: flex; align-items: center; gap: 14px; }
  .habit-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; background: var(--surface-2); }
  .habit-body { flex: 1; min-width: 0; }
  .habit-name { font-weight: 600; font-size: 14.5px; }
  .habit-streak { font-size: 12px; color: var(--text-soft); display: flex; align-items: center; gap: 4px; }
  .habit-toggle { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--border-strong); background: transparent; cursor: pointer; color: var(--text-soft); display:flex; align-items:center; justify-content:center; flex-shrink: 0; }
  .habit-toggle.done { background: var(--success); border-color: var(--success); color: #fff; }
  .habit-exempt-note { font-size: 11.5px; color: var(--accent); margin-top: 2px; }
  .week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .week-day { border-radius: var(--radius-s); padding: 8px 4px; text-align: center; background: var(--surface-2); border: 1px solid var(--border); }
  .week-day.is-today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .week-day .wd-name { font-size: 11px; color: var(--text-faint); margin-bottom: 4px; }
  .week-day .wd-num { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .week-day .wd-icons { display: flex; justify-content: center; gap: 3px; font-size: 12px; min-height: 16px; }
  .holiday-list { list-style: none; margin: 0; padding: 0; }
  .holiday-list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .holiday-list li:last-child { border-bottom: none; }

  /* focus */
  .focus-wrap { display: flex; flex-direction: column; align-items: center; padding: 30px 10px; }
  .focus-ring { position: relative; width: 240px; height: 240px; }
  .focus-ring svg { transform: rotate(-90deg); }
  .focus-time { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 700; }
  .focus-task { color: var(--text-soft); font-size: 13.5px; margin: 16px 0 4px; }
  .focus-controls { display: flex; gap: 10px; margin-top: 18px; }
  .focus-presets { display: flex; gap: 8px; margin-top: 22px; }
  .preset-btn { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); font-size: 12.5px; cursor: pointer; }
  .preset-btn.active { background: var(--surface-3); color: var(--text); border-color: var(--border-strong); }

  /* advisor */
  .advisor-intro { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  .advisor-avatar { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .advisor-avatar svg { stroke: var(--accent-ink); width: 19px; height: 19px; }
  .advisor-form { display: flex; gap: 8px; margin-bottom: 18px; }
  .advisor-form textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 140px; padding: 11px 14px; border-radius: var(--radius-m);
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; font-size: 14px;
  }
  .advisor-form textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .advisor-mic-btn { align-self: stretch; }
  .advisor-mic-btn.listening { color: var(--danger); background: color-mix(in srgb, var(--danger) 16%, transparent); animation: mic-pulse 1.2s ease-in-out infinite; }
  @keyframes mic-pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 35%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }
  .advisor-examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .advisor-ex { font-size: 12.5px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); cursor: pointer; }
  .advisor-ex:hover { border-color: var(--accent); color: var(--accent); }
  .advisor-thinking { display: flex; align-items: center; gap: 10px; color: var(--text-soft); font-size: 13.5px; padding: 16px 0; }
  .advisor-dots span { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin-inline-end: 3px; animation: advisor-pulse 1s ease-in-out infinite; }
  .advisor-dots span:nth-child(2) { animation-delay: .15s; }
  .advisor-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes advisor-pulse { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .advice-card { border-radius: var(--radius-l); border: 1px solid var(--border-strong); background: var(--surface); padding: 18px 20px; margin-bottom: 14px; }
  .advice-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
  .advice-top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .advice-speak-btn.speaking { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .advice-badge.yes { background: color-mix(in srgb, var(--success) 18%, transparent); color: var(--success); }
  .advice-badge.maybe { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }
  .advice-badge.no { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
  .advice-headline { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .advice-reason { font-size: 13.5px; color: var(--text-soft); margin-bottom: 10px; }
  .advice-conflicts { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .advice-conflicts li { font-size: 12.5px; color: var(--danger); }
  .advice-action { background: var(--surface-2); border-radius: var(--radius-m); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .advice-action .at { font-weight: 600; font-size: 13.5px; }
  .advice-action .am { font-size: 12px; color: var(--text-soft); }
  .advice-actions-row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* fitness */
  .split-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 12px; margin-bottom: 18px; }
  .split-card { border-radius: var(--radius-m); padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); }
  .split-card .k { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.05em; }
  .split-card .v { font-size: 13.5px; margin-top: 4px; }
  .ex-list { list-style: none; margin: 0; padding: 0; }
  .ex-list li { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; gap: 10px; }
  .ex-list li:last-child { border-bottom: none; }
  .ex-list .lb { color: var(--text-soft); }
  .ex-list a { text-decoration: none; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .ex-list a:hover { text-decoration: underline; }
  .ex-list .plain { font-size: 12px; color: var(--text-faint); font-style: italic; }
  .tip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tip-chip { font-size: 12.5px; padding: 7px 12px; border-radius: var(--radius-s); background: var(--surface-2); border: 1px solid var(--border); text-decoration: none; color: var(--text); }
  .tip-chip:hover { border-color: var(--accent); color: var(--accent); }

  /* goals */
  .goal-card { margin-bottom: 14px; }
  .goal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .goal-head h3 { font-size: 16px; margin: 0; }
  .goal-progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .ms-list { list-style: none; margin: 0 0 10px; padding: 0; }
  .ms-item { display: flex; align-items: center; gap: 9px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .ms-item:last-child { border-bottom: none; }
  .ms-item.done .ms-title { text-decoration: line-through; color: var(--text-faint); }
  .ms-check { width: 19px; height: 19px; border-radius: 6px; border: 1.5px solid var(--border-strong); background: transparent; flex-shrink: 0; cursor: pointer; color: var(--accent-ink); display: flex; align-items: center; justify-content: center; }
  .ms-check.done { background: var(--accent); border-color: var(--accent); }
  .ms-check svg { width: 12px; height: 12px; }
  .ms-title { flex: 1; }
  .ms-del { background: none; border: none; color: var(--text-faint); cursor: pointer; padding: 2px; }
  .ms-del:hover { color: var(--danger); }
  .ms-add-row { display: flex; gap: 8px; }
  .ms-input { flex: 1; padding: 8px 10px; border-radius: var(--radius-s); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 13px; }
  .ms-input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .exam-meta { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-faint); white-space: nowrap; }
  .exam-meta.soon { background: color-mix(in srgb, var(--warning) 22%, transparent); color: var(--warning); }
  .exam-meta.urgent { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
  .exam-add-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .exam-add-row .ms-input { flex: 1; min-width: 140px; }
  .exam-add-row input[type="date"] { padding: 8px 10px; border-radius: var(--radius-s); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 13px; }
  .exam-add-row input[type="date"]:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .goal-manual-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text-soft); }
  .goal-manual-row input[type="range"] { flex: 1; accent-color: var(--accent); }

  /* money */
  .money-summary { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 4px; }
  .money-balance { font-size: 30px; font-weight: 800; }
  .money-sub { display: flex; gap: 16px; font-size: 13px; color: var(--text-soft); margin-top: 10px; }
  .money-sub b { color: var(--text); }
  .money-add-row { display: flex; gap: 8px; margin: 16px 0; }
  .money-entries { list-style: none; margin: 0; padding: 0; }
  .money-entry { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .money-entry:last-child { border-bottom: none; }
  .money-entry .em { font-size: 17px; flex-shrink: 0; }
  .money-entry .mt { flex: 1; min-width: 0; }
  .money-entry .mt .cat { color: var(--text-soft); font-size: 12px; }
  .money-entry .amt { font-weight: 700; }
  .money-entry .amt.income { color: var(--success); }
  .money-entry .amt.expense { color: var(--danger); }
  .money-entry .m-del { background: none; border: none; color: var(--text-faint); cursor: pointer; }
  .money-entry .m-del:hover { color: var(--danger); }

  /* modal */

  /* splash intro */
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    cursor: pointer;
    animation: splash-out 0.55s var(--ease-in-out) 2.5s forwards;
  }
  #splash .splash-mark {
    width: 68px; height: 68px; border-radius: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(0.7);
    animation: splash-mark-in 0.65s var(--ease-out) 0.2s forwards;
  }
  #splash .splash-mark svg { width: 34px; height: 34px; stroke: var(--accent-ink); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #splash .splash-word {
    font-family: "Rubik", sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.01em; color: var(--text);
    opacity: 0; transform: translateY(16px);
    animation: splash-rise-in 0.55s var(--ease-out) 0.55s forwards;
  }
  #splash .splash-tag {
    font-size: 13px; color: var(--text-soft); opacity: 0;
    animation: splash-fade-in 0.5s var(--ease-out) 1.15s forwards;
  }
  #splash .splash-line {
    width: 130px; height: 2px; border-radius: 2px; background: var(--surface-3); overflow: hidden; position: relative;
    opacity: 0; animation: splash-fade-in 0.4s var(--ease-out) 1.4s forwards;
  }
  #splash .splash-line::after {
    content: ""; position: absolute; inset: 0; width: 40%; background: var(--accent); border-radius: 2px;
    animation: splash-sweep 1s var(--ease-in-out) 1.45s forwards;
  }
  #splash .splash-skip {
    position: absolute; bottom: 28px; font-size: 12px; color: var(--text-faint);
    opacity: 0; animation: splash-fade-in 0.5s var(--ease-out) 1.6s forwards;
  }
  @keyframes splash-mark-in { to { opacity: 1; transform: scale(1); } }
  @keyframes splash-rise-in { to { opacity: 1; transform: translateY(0); } }
  @keyframes splash-fade-in { to { opacity: 1; } }
  @keyframes splash-sweep { from { transform: translateX(-120%); } to { transform: translateX(260%); } }
  @keyframes splash-out { to { opacity: 0; visibility: hidden; pointer-events: none; } }
  @media (prefers-reduced-motion: reduce) {
    #splash { display: none; }
  }

  /* ================= Glow Up: progress tab ================= */
  var guProgressRange = 7;
  function guStatsForRange(days) {
    var cutoff = days === 'all' ? null : (function () { var d = todayDate(); d.setDate(d.getDate() - (days - 1)); return d; })();
    var inRange = function (k) { return !cutoff || new Date(k + 'T00:00:00') >= cutoff; };
    var exercisesDone = 0, tipsUseful = 0, videosWatched = 0, videosApplied = 0, routinesCompletedDays = 0;
    state.glowUp.exercises.forEach(function (e) { (e.completionLog || []).forEach(function (l) { if (inRange(l.date)) exercisesDone++; }); });
    tipsUseful = state.glowUp.tips.filter(function (t) { return t.status === 'useful'; }).length;
    videosWatched = state.glowUp.videos.filter(function (v) { return v.watchStatus !== 'not_watched'; }).length;
    videosApplied = state.glowUp.videos.filter(function (v) { return v.watchStatus === 'applied'; }).length;
    Object.keys(state.glowUp.streakLog).forEach(function (k) { if (inRange(k) && state.glowUp.streakLog[k]) routinesCompletedDays++; });
    var catStreaks = {};
    guCats().forEach(function (c) {
      var exList = state.glowUp.exercises.filter(function (e) { return (e.categoryIds || []).indexOf(c.id) !== -1; });
      var n = 0;
      exList.forEach(function (e) { (e.completionLog || []).forEach(function (l) { if (inRange(l.date)) n++; }); });
      if (n > 0) catStreaks[c.id] = n;
    });
    return { exercisesDone: exercisesDone, tipsUseful: tipsUseful, videosWatched: videosWatched, videosApplied: videosApplied, routinesCompletedDays: routinesCompletedDays, catStreaks: catStreaks };
  }

        saveState(); rerenderFn();
      });
    });

      b.addEventListener('click', function () {

        saveState(); rerenderFn();
      });

  /* ================= Glow Up: export / import ================= */
  function guExportJson() {
    var payload = { exportedAt: new Date().toISOString(), app: 'מסלול - Glow Up', data: state.glowUp };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'glowup-backup-' + dkey(todayDate()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    toast('קובץ הגיבוי ירד');
  }
  function guImportJsonFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try { parsed = JSON.parse(reader.result); } catch (e) { toast('קובץ לא תקין'); return; }
      var data = parsed && parsed.data ? parsed.data : parsed;
      var validKeys = ['categories', 'exercises', 'tips', 'videos', 'reminders', 'routines', 'journal'];
      var looksValid = data && typeof data === 'object' && validKeys.some(function (k) { return Array.isArray(data[k]); });
      if (!looksValid) { toast('קובץ לא מוכר - ייבוא בוטל'); return; }
      openConfirmModal('נמצא קובץ גיבוי של Glow Up. למזג עם הנתונים הקיימים, או להחליף אותם לגמרי?', function () {
        guMergeImport(data);
      }, { title: 'ייבוא נתוני Glow Up', confirmLabel: 'מיזוג (מומלץ)' });
    };
    reader.readAsText(file);
  }
  function guMergeImport(data) {
    ['exercises', 'tips', 'videos', 'reminders', 'routines', 'journal', 'collections'].forEach(function (k) {
      if (Array.isArray(data[k])) {
        var existingIds = state.glowUp[k].map(function (x) { return x.id; });
        data[k].forEach(function (item) { if (existingIds.indexOf(item.id) === -1) state.glowUp[k].push(item); });
      }
    });
    if (Array.isArray(data.categories)) {
      var existingCatIds = state.glowUp.categories.map(function (c) { return c.id; });
      data.categories.forEach(function (c) { if (existingCatIds.indexOf(c.id) === -1) state.glowUp.categories.push(c); });
    }
    saveState(); renderGuBody();
    toast('הנתונים מוזגו בהצלחה');
  }

  function wireUpgradesBody(el) {

        if (res.ok) { toast('השיקוי נוסף למלאי'); renderUpgrades(); }
        else toast('אין מספיק Coins');

        var res = shopUsePotion(b.dataset.shopUsePotion);
        if (res.ok) { gamFlushEventQueue(null); toast('השיקוי הופעל!'); renderUpgrades(); }

    Array.prototype.forEach.call(el.querySelectorAll('[data-shop-econ]'), function (inp) {

        saveState();
      });
    });
  }

  function nowNextLater() {
    var list = todayTasks();
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var idx = -1;
    for (var i = 0; i < list.length; i++) { if (timeToMin(list[i].time) <= nowMin) idx = i; else break; }
    return { now: list[idx] || null, next: list[idx + 1] || null, later: list[idx + 2] || null, idx: idx, list: list };

  /* ================= daily score (0-100, separate from XP) ================= */
  var IMPORTANCE_WEIGHT = { small: 1, regular: 1, important: 1.5, challenging: 2 };
  var lastDailyScoreShown = null;
  function gamDailyScore() {
    var list = todayTasks();
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var required = list.filter(function (t) { return !t.optional; });
    var doneCount = 0, pendingCount = 0, overdueCount = 0, totalWeight = 0, earned = 0;
    required.forEach(function (t) {
      var w = IMPORTANCE_WEIGHT[t.importance] || 1;
      var dueMin = timeToMin(t.time);
      if (t.done) {
        doneCount++;
        totalWeight += w;
        var compMin = dueMin;
        if (t.completedAt) { var cd = new Date(t.completedAt); compMin = cd.getHours() * 60 + cd.getMinutes(); }
        var lateBy = compMin - dueMin;
        var credit = lateBy <= 15 ? 1 : (lateBy <= 60 ? 0.8 : 0.6);
        earned += w * credit;
      } else if (dueMin < nowMin) {
        overdueCount++;
        totalWeight += w;
      } else {
        pendingCount++;
      }
    });
    var score = totalWeight > 0 ? Math.round(earned / totalWeight * 100) : 100;
    return { score: score, doneCount: doneCount, pendingCount: pendingCount, overdueCount: overdueCount, total: required.length };
  }
  function dailyScoreLabel(score) {
    if (score >= 90) return 'מצוין';
    if (score >= 70) return 'טוב';
    if (score >= 50) return 'סביר';
    return 'דורש תשומת לב';
  }

  function smartNowSuggestion(nnl) {
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var nextMin = nnl.next ? timeToMin(nnl.next.time) : (23 * 60 + 30);
    var freeMin = Math.max(0, nextMin - nowMin);
    var todayKey = dkey(todayDate());

    var goalWithStep = null, stepTitle = null;
    state.goals.some(function (g) {
      var step = g.milestones.filter(function (m) { return !m.done; })[0];
      if (step) { goalWithStep = g; stepTitle = step.title; return true; }
      return false;
    });
    if (freeMin >= 20 && goalWithStep) {
      return { icon: '🎯', title: stepTitle, sub: 'שלב הבא ביעד "' + goalWithStep.title + '" · ' + freeMin + ' דקות פנויות עד "' + (nnl.next ? nnl.next.title : '') + '"' };
    }

    var pendingHabit = HABITS.filter(function (h) { return !((state.habitLog[h.id] || {})[todayKey]); })[0];
    if (pendingHabit) {
      return { icon: pendingHabit.emoji, title: pendingHabit.name, sub: 'הרגל שעוד לא סימנת היום · ' + freeMin + ' דקות פנויות' };
    }
    return null;
  }

  function findFreeGaps(minMinutes) {
    var list = todayTasks();
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var upcoming = list.filter(function (t) { return timeToMin(t.time) > nowMin; })
      .sort(function (a, b) { return timeToMin(a.time) - timeToMin(b.time); });
    var sleepTask = upcoming.filter(function (t) { return /לישון|שינה/.test(t.title); })[0];
    var dayEnd = sleepTask ? timeToMin(sleepTask.time) : 23 * 60 + 30;
    var points = [nowMin];
    upcoming.forEach(function (t) { var m = timeToMin(t.time); if (m <= dayEnd) points.push(m); });
    if (points[points.length - 1] !== dayEnd) points.push(dayEnd);
    var gaps = [];
    for (var i = 0; i < points.length - 1; i++) {
      var len = points[i + 1] - points[i];
      if (len >= minMinutes) gaps.push({ start: points[i], end: points[i + 1], minutes: len });
    }
    return gaps;
  }

      var d = new Date();

  function wireDragReorder(container, list) {
    if (!container) return;
    Array.prototype.forEach.call(container.querySelectorAll('.drag-handle'), function (handle) {
      handle.addEventListener('click', function (e) { e.stopPropagation(); });
      handle.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var row = handle.closest('.t-item');
        var dragId = row.dataset.id;
        row.classList.add('dragging');
        var placeholder = document.createElement('div');
        placeholder.className = 't-item drop-indicator';
        row.after(placeholder);
        try { handle.setPointerCapture(e.pointerId); } catch (err) {}

        function itemsExcludingDragged() {
          return Array.prototype.filter.call(container.querySelectorAll('.t-item'), function (it) {
            return it !== row && it !== placeholder;
          });
        }
        function onMove(ev) {
          var items = itemsExcludingDragged();
          var placed = false;
          for (var i = 0; i < items.length; i++) {
            var rect = items[i].getBoundingClientRect();
            if (ev.clientY < rect.top + rect.height / 2) {
              items[i].before(placeholder);
              placed = true;
              break;
            }
          }
          if (!placed) container.appendChild(placeholder);
        }
        function onUp(ev) {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          try { handle.releasePointerCapture(ev.pointerId); } catch (err) {}
          row.classList.remove('dragging');

          var prevEl = placeholder.previousElementSibling;
          var nextEl = placeholder.nextElementSibling;
          var prevTask = prevEl && prevEl.dataset.id ? list.find(function (t) { return t.id === prevEl.dataset.id; }) : null;
          var nextTask = nextEl && nextEl.dataset.id ? list.find(function (t) { return t.id === nextEl.dataset.id; }) : null;
          placeholder.remove();

          var dragTask = list.find(function (t) { return t.id === dragId; });
          var newMin;
          if (prevTask && nextTask) {
            var a = timeToMin(prevTask.time), b = timeToMin(nextTask.time);
            newMin = (b - a) >= 2 ? Math.round((a + b) / 2) : a + 1;
          } else if (prevTask) {
            newMin = timeToMin(prevTask.time) + 5;
          } else if (nextTask) {
            newMin = timeToMin(nextTask.time) - 5;
          } else {
            newMin = timeToMin(dragTask.time);
          }
          var newTime = minToTime(newMin);
          if (newTime !== dragTask.time) {
            dragTask.time = newTime;
            saveState();
            toast('הועבר לשעה ' + newTime);
          }
          renderSchedule();
          renderDashboard();
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    });
  }

  /* text-to-speech (Hebrew) for advisor answers */
  var speechActiveBtn = null;
  function speechSupported() { return typeof window !== 'undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined'; }
  function pickHebrewVoice() {
    try {
      var voices = window.speechSynthesis.getVoices() || [];
      return voices.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf('he') === 0; })[0] || null;
    } catch (e) { return null; }
  }
  function resetSpeakBtn(btn) {
    if (!btn) return;
    btn.classList.remove('speaking');
    btn.innerHTML = icon('speaker');
  }
  function speakText(text, btn) {
    if (!speechSupported()) return;
    var synth = window.speechSynthesis;
    if (speechActiveBtn === btn) {
      synth.cancel();
      resetSpeakBtn(btn);
      speechActiveBtn = null;
      return;
    }
    synth.cancel();
    if (speechActiveBtn) resetSpeakBtn(speechActiveBtn);
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'he-IL';
    var voice = pickHebrewVoice();
    if (voice) utter.voice = voice;
    utter.rate = 1;
    speechActiveBtn = btn;
    btn.classList.add('speaking');
    btn.innerHTML = icon('speakerMute');
    utter.onend = function () { if (speechActiveBtn === btn) { resetSpeakBtn(btn); speechActiveBtn = null; } };
    utter.onerror = function () { if (speechActiveBtn === btn) { resetSpeakBtn(btn); speechActiveBtn = null; } };
    synth.speak(utter);
  }
  if (speechSupported() && window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = function () {};
  }

  function speechRecognitionSupported() {
    return typeof window !== 'undefined' && !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  }
  var micRecognition = null;
  var micActive = false;
  function toggleVoiceInput(textareaEl, micBtn) {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR || !textareaEl || !micBtn) return;
    if (micActive && micRecognition) {
      micRecognition.stop();
      return;
    }
    var rec = new SR();
    rec.lang = 'he-IL';
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;
    micRecognition = rec;
    micActive = true;
    micBtn.classList.add('listening');
    var baseValue = textareaEl.value.trim();
    var stopped = false;
    var stop = function () {
      if (stopped) return;
      stopped = true;
      micActive = false;
      micBtn.classList.remove('listening');
      micRecognition = null;
    };
    rec.onresult = function (event) {
      var interim = '', final = '';
      for (var i = event.resultIndex; i < event.results.length; i++) {
        var res = event.results[i];
        if (res.isFinal) final += res[0].transcript;
        else interim += res[0].transcript;
      }
      textareaEl.value = (baseValue ? baseValue + ' ' : '') + final + interim;
    };
    rec.onerror = function (e) {
      stop();
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('אין הרשאה למיקרופון');
      else if (e.error !== 'aborted' && e.error !== 'no-speech') toast('לא הצלחתי להקשיב. אפשר לנסות שוב.');
    };
    rec.onend = stop;
    try { rec.start(); } catch (err) { stop(); }
  }

  function normalizeAdvice(data) {
    data = data && typeof data === 'object' ? data : {};
    var rec = ['yes', 'maybe', 'no'].indexOf(data.recommendation) >= 0 ? data.recommendation : 'maybe';
    var headline = typeof data.headline === 'string' && data.headline.trim() ? data.headline.trim() : 'קיבלתי כמה מחשבות על זה';
    var reasoning = typeof data.reasoning === 'string' ? data.reasoning.trim() : '';
    var conflicts = Array.isArray(data.conflicts) ? data.conflicts.filter(function (c) { return typeof c === 'string' && c.trim(); }) : [];
    var rawActions = Array.isArray(data.suggestedActions) ? data.suggestedActions
      : (data.suggestedAction && typeof data.suggestedAction === 'object' ? [data.suggestedAction] : []);
    var actions = rawActions.map(function (sa) {
      if (!sa || typeof sa !== 'object') return null;
      var time = typeof sa.time === 'string' && /^([01]?\d|2[0-3]):[0-5]\d$/.test(sa.time) ? sa.time : null;
      var title = typeof sa.title === 'string' && sa.title.trim() ? sa.title.trim().slice(0, 80) : null;
      var cat = CATS[sa.category] ? sa.category : 'personal';
      if (!time || !title) return null;
      return { title: title, time: time, category: cat, type: sa.type === 'daily' ? 'daily' : 'one_time' };
    }).filter(Boolean).slice(0, 12);
    return { recommendation: rec, headline: headline, reasoning: reasoning, conflicts: conflicts, actions: actions };
  }

  function buildAdviceCard(advice, question) {

  /* --- local rule-based reasoning: reads real app state, no network/account needed --- */
  function findPendingHabit() {
    var todayKey = dkey(todayDate());
    return HABITS.filter(function (h) { return !((state.habitLog[h.id] || {})[todayKey]); })[0] || null;
  }
  function findNextGoalStep() {
    var found = null;
    state.goals.some(function (g) {
      var step = g.milestones.filter(function (m) { return !m.done; })[0];
      if (step) { found = { goal: g, step: step }; return true; }
      return false;
    });
    return found;
  }
  function nearestExam() {
    var exams = (state.learning.exams || []).filter(function (e) { return e.date && examDaysLeft(e.date) >= 0; });
    exams.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    return exams[0] || null;
  }
  function guessCategory(text) {
    if (/אימון|כושר|ריצ[הת]|איגרוף|חד"?כ|קרדיו|שריר|ספורט|אתלטיקה|כדורגל|כדורסל|פינגפונג/.test(text)) return 'fitness';
    if (/למיד[הת]|תכנות|שיעור|לימוד|אתר|קוד|מבחן|שפ[הות]|פסיכולוגיה/.test(text)) return 'learning';
    if (/אוכל|ארוח[הת]|בריאות|לאכול|מים/.test(text)) return 'health';
    if (/פסנתר|תחביב|ציור|מוזיק[הת]/.test(text)) return 'hobby';
    if (/חבר|חברה|מפגש|יציאה/.test(text)) return 'social';
    return 'personal';
  }
  function parseTimeFromText(q) {
    var m = q.match(/([01]?\d|2[0-3]):([0-5]\d)/);
    if (!m) return null;
    var h = m[1].length === 1 ? '0' + m[1] : m[1];
    return h + ':' + m[2];
  }
  function parseDurationMinutes(q) {
    var mHour = q.match(/(\d+(?:\.\d+)?)\s*שעות?/);
    if (mHour) return Math.round(parseFloat(mHour[1]) * 60);
    var mMin = q.match(/(\d+)\s*(דקות|דק['׳]?)/);
    if (mMin) return parseInt(mMin[1], 10);
    if (/חצי שעה/.test(q)) return 30;
    return null;
  }
  function extractActivityTitle(q, timeStr) {
    var t = q;
    t = t.replace(/^אני\s+(רוצה|צריך|צריכה)\s+ל?הוסיף\s+/, '');
    t = t.replace(/^(תוסיף|תוסיפי|תקבע|תקבעי)\s+/, '');
    t = t.replace(/היום/g, '');
    if (timeStr) t = t.replace(new RegExp('ב-?' + timeStr.replace(':', '[:.]?')), '');
    t = t.replace(/[?!.]+$/, '').replace(/\s+/g, ' ').trim();
    return t || 'פעילות חדשה';
  }

  function generateAdvice(question) {
    var q = (question || '').trim();
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var list = todayTasks();
    var next = list.filter(function (t) { return timeToMin(t.time) > nowMin; })[0] || null;
    var exam = nearestExam();
    var examNote = exam ? ('יש לך מבחן ב"' + exam.title + '" בעוד ' + examDaysLeft(exam.date) + ' ימים.') : null;

    if (/עייף|עייפה|עייפים|עייפות|אין לי כוח|מותש|מותשת/.test(q)) {
      var fitLater = list.some(function (t) { return t.category === 'fitness' && timeToMin(t.time) > nowMin; });
      return {
        recommendation: fitLater ? 'maybe' : 'yes',
        headline: 'תקשיב לגוף - עייפות היא אינדיקציה אמיתית',
        reasoning: fitLater
          ? 'יש לך עוד אימון מתוכנן היום - אפשר להוריד עצימות, לקצר אותו, או להזיז אותו אם יש גמישות. שינה ומנוחה חשובות לא פחות מהאימון עצמו.'
          : 'אין לך יותר אימונים מתוכננים היום, אז זה זמן טוב למנוחה קצרה, שתיית מים, ולהקדים ללכת לישון.',
        conflicts: examNote ? [examNote] : [],
        suggestedActions: []
      };
    }

    if (/עמוס|עמוסה|לחוץ|לחוצה|יותר מדי|מה כדאי להוריד|לבטל/.test(q)) {
      var counts = {};
      list.forEach(function (t) { counts[t.category] = (counts[t.category] || 0) + 1; });
      var droppable = ['social', 'hobby', 'personal'].filter(function (c) { return counts[c] > 1; })[0];
      return {
        recommendation: 'maybe',
        headline: list.length > 14 ? 'היום באמת עמוס - שווה לגזור משהו' : 'זה לא נראה חריג מדי, אבל אפשר לפנות קצת אוויר',
        reasoning: droppable
          ? ('יש לך כמה פריטים בקטגוריית "' + CATS[droppable].label + '" - זה המקום הכי בטוח לוותר על פריט אחד או לשלב שניים ביחד, בלי לפגוע בלימודים, כושר או שינה.')
          : 'רוב מה שיש לך היום נראה חיוני (למידה, כושר, שינה) - קשה למצוא מה להוריד בלי לוותר על משהו חשוב. אולי עדיף לקצר משך זמן של כמה פריטים במקום למחוק לגמרי.',
        conflicts: examNote ? [examNote] : [],
        suggestedActions: []
      };
    }

    if (/(תבנה|בנה לי|תיצור|צור לי).*יום/.test(q)) {
      var lastYom = q.lastIndexOf('יום');
      var theme = lastYom >= 0 ? q.slice(lastYom + 3).replace(/[?!.]+$/, '').trim() : '';
      if (!theme) theme = 'מותאם אישית';
      var themedFitness = guessCategory(theme) === 'fitness';
      var base = themedFitness ? TEMPLATES.school : TEMPLATES.normal;
      var picked = base.items.filter(function (it) { return it.category !== 'personal' || /פסנתר|למידה/.test(it.title); });
      var actions = picked.slice(0, 12).map(function (it) {
        var title = (themedFitness && it.category === 'fitness') ? ('אימון ' + theme) : it.title;
        return { title: title, time: it.time, category: it.category, type: 'one_time' };
      });
      return {
        recommendation: 'yes',
        headline: 'הצעה ליום "' + theme + '"',
        reasoning: 'בניתי הצעה על בסיס מבנה יום שכבר עובד לך, עם דגש על ' + theme + '. אפשר להוסיף הכל להיום או לשמור כסוג יום חדש לשימוש עתידי.',
        conflicts: examNote ? [examNote] : [],
        suggestedActions: actions
      };
    }

    var timeStr = parseTimeFromText(q);
    if (timeStr && /(תוסיף|רוצה להוסיף|תקבע|לקבוע|להוסיף)/.test(q)) {
      var title = extractActivityTitle(q, timeStr);
      var cat = guessCategory(q);
      var conflict = list.filter(function (t) { return t.time === timeStr; })[0];
      return {
        recommendation: conflict ? 'maybe' : 'yes',
        headline: conflict ? 'יש התנגשות בשעה הזו' : ('"' + title + '" ב-' + timeStr + ' נראה סביר'),
        reasoning: conflict
          ? 'בזמן הזה כבר יש לך "' + conflict.title + '" - כדאי לבחור שעה סמוכה פנויה במקום.'
          : 'זה לא מתנגש עם שום דבר אחר היום. אם זה אימון, כדאי לוודא שיש מספיק זמן התאוששות לפני שינה.',
        conflicts: examNote ? [examNote] : [],
        suggestedActions: [{ title: title, time: timeStr, category: cat, type: 'one_time' }]
      };
    }

    var duration = parseDurationMinutes(q);
    if (/פנוי|מה כדאי לעשות|משעמם/.test(q) || duration) {
      var minutes = duration || 60;
      var gaps = findFreeGaps(Math.min(minutes, 240));
      var slot = gaps[0] || null;
      var habit = findPendingHabit();
      var goalStep = findNextGoalStep();
      var pickTitle, pickCat;
      if (goalStep) { pickTitle = goalStep.step.title; pickCat = 'personal'; }
      else if (habit) { pickTitle = habit.name; pickCat = 'health'; }
      else { pickTitle = 'זמן פנוי - קריאה, מתיחות או תחביב'; pickCat = 'personal'; }
      var startTime = slot ? minToTime(slot.start) : minToTime(nowMin);
      return {
        recommendation: slot ? 'yes' : 'maybe',
        headline: slot ? ('יש לך ' + minutes + ' דקות פנויות מ-' + startTime) : 'הלוח היום צפוף לחלון כזה',
        reasoning: goalStep
          ? ('זה זמן טוב לקדם את היעד "' + goalStep.goal.title + '" - השלב הבא הוא "' + goalStep.step.title + '".')
          : habit
          ? ('"' + habit.name + '" עוד לא סומן היום - זה זמן טוב בשבילו.')
          : 'אין הרגל דחוף או שלב יעד ממתין כרגע, אז זה זמן פנוי גמיש - תחביב, מנוחה או קריאה.',
        conflicts: (slot ? [] : ['לא מצאתי חלון פנוי של ' + minutes + ' דקות היום ברצף.']).concat(examNote ? [examNote] : []),
        suggestedActions: slot ? [{ title: pickTitle, time: startTime, category: pickCat, type: 'one_time' }] : []
      };
    }

    var todayKey = dkey(todayDate());
    var habitsDone = HABITS.filter(function (h) { return (state.habitLog[h.id] || {})[todayKey]; }).length;
    var goalStep2 = findNextGoalStep();
    var extra = goalStep2
      ? ('כשיהיה לך רגע פנוי, השלב הבא ביעד "' + goalStep2.goal.title + '" הוא "' + goalStep2.step.title + '".')
      : 'אפשר לשאול אותי משהו יותר ספציפי - זמן פנוי, עייפות, או הוספת פעילות בשעה מסוימת - ותקבל המלצה מדויקת יותר.';
    return {
      recommendation: 'maybe',
      headline: next ? ('הדבר הבא בלוח שלך: "' + next.title + '" ב-' + next.time) : 'אין עוד פריטים מתוכננים היום',
      reasoning: 'סימנת ' + habitsDone + ' מתוך ' + HABITS.length + ' הרגלים היום. ' + extra,
      conflicts: examNote ? [examNote] : [],
      suggestedActions: []
    };
  }

  function askAdvisor(question) {
    if (advisorPending) return;
    advisorPending = true;
    if (activePanel === 'advisor') renderAdvisor();
    setTimeout(function () {
      var raw;
      try { raw = generateAdvice(question); } catch (e) { raw = null; }
      advisorPending = false;
      advisorEntries.unshift({ question: question, advice: normalizeAdvice(raw) });
      if (advisorEntries.length > 30) advisorEntries.length = 30;
      saveState();
      if (activePanel === 'advisor') renderAdvisor();
    }, 450);
  }

  /* ================= focus ================= */
  var focusState = { total: 25 * 60, remaining: 25 * 60, running: false, timer: null };
  function renderFocus() {
    var el = document.getElementById('panel-focus');
    var r = 100, c = 2 * Math.PI * r;
    var doneToday = (state.focusLog[dkey(todayDate())] || 0);
    el.innerHTML = '<div class="page-head"><div><h2 class="page-title">פוקוס</h2><p class="page-sub">טיימר פומודורו למקטעי עבודה מרוכזת</p></div></div>' +
      '<div class="card"><div class="focus-wrap">' +
        '<div class="focus-ring"><svg width="240" height="240" viewBox="0 0 240 240">' +
          '<circle class="ring-track" cx="120" cy="120" r="' + r + '" stroke-width="10" fill="none"/>' +
          '<circle class="ring-fill" id="focus-ring-fill" cx="120" cy="120" r="' + r + '" stroke-width="10" fill="none" stroke-dasharray="' + c + '" stroke-dashoffset="0"/>' +
        '</svg><div class="focus-time num" id="focus-time">25:00</div></div>' +
        '<div class="focus-controls">' +
          '<button class="btn btn-primary" id="focus-toggle">' + icon('play') + 'התחל' + '</button>' +
          '<button class="btn btn-ghost" id="focus-reset">' + icon('reset') + '</button>' +
        '</div>' +
        '<div class="focus-presets">' +
          '<button class="preset-btn active" data-min="25">25 דק׳</button>' +
          '<button class="preset-btn" data-min="50">50 דק׳</button>' +
          '<button class="preset-btn" data-min="10">10 דק׳</button>' +
        '</div>' +
        '<p class="focus-task">הושלמו היום: <b class="num">' + doneToday + '</b> מקטעים</p>' +
      '</div></div>';

    var ring = document.getElementById('focus-ring-fill');
    var timeEl = document.getElementById('focus-time');
    var toggleBtn = document.getElementById('focus-toggle');

    function paint() {
      var m = Math.floor(focusState.remaining / 60), s = focusState.remaining % 60;
      timeEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      var frac = focusState.remaining / focusState.total;
      ring.setAttribute('stroke-dashoffset', c - frac * c);
      toggleBtn.innerHTML = icon(focusState.running ? 'pause' : 'play') + (focusState.running ? 'השהה' : 'התחל');
    }
    paint();

    toggleBtn.addEventListener('click', function () {
      focusState.running = !focusState.running;
      if (focusState.running) {
        focusState.timer = setInterval(function () {
          focusState.remaining--;
          if (focusState.remaining <= 0) {
            clearInterval(focusState.timer);
            focusState.running = false;
            focusState.remaining = 0;
            var k = dkey(todayDate());
            state.focusLog[k] = (state.focusLog[k] || 0) + 1;
            saveState();
            toast('מקטע פוקוס הושלם ✓');
            focusState.remaining = focusState.total;
          }
          paint();
        }, 1000);
      } else {
        clearInterval(focusState.timer);
      }
      paint();
    });
    document.getElementById('focus-reset').addEventListener('click', function () {
      clearInterval(focusState.timer);
      focusState.running = false;
      focusState.remaining = focusState.total;
      paint();
    });
    Array.prototype.forEach.call(el.querySelectorAll('.preset-btn'), function (b) {
      b.addEventListener('click', function () {
        clearInterval(focusState.timer);
        focusState.running = false;
        focusState.total = (+b.dataset.min) * 60;
        focusState.remaining = focusState.total;
        Array.prototype.forEach.call(el.querySelectorAll('.preset-btn'), function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        paint();
      });
    });
  }
