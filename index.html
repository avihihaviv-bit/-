<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d121e">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מסלול">
<meta name="mobile-web-app-capable" content="yes">
<title>מסלול</title>
<meta name="description" content="מערכת חיים אישית - לוח יומי, הרגלים, פוקוס וכושר, במקום אחד.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #0d121e;
    --surface: #141b2b;
    --surface-2: #1b2436;
    --surface-3: #232e44;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #eef1f8;
    --text-soft: #8d96b3;
    --text-faint: #5c6483;
    --accent: #45d6c8;
    --accent-ink: #04211d;
    --accent-2: #f5a94e;
    --accent-2-ink: #2b1a04;
    --success: #55cf8f;
    --warning: #f2c14e;
    --danger: #ef6f6a;
    --shadow: rgba(0,0,0,0.45);
    --glass: rgba(255,255,255,0.04);
    --cat-fitness: #d97b78;
    --cat-learning: #7f9bdb;
    --cat-health: #8fbf74;
    --cat-personal: #a98bd0;
    --cat-hobby: #d3ab5f;
    --cat-social: #63b4bb;
    --radius-s: 8px;
    --radius-m: 14px;
    --radius-l: 20px;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f5fa;
      --surface: #ffffff;
      --surface-2: #eef1f7;
      --surface-3: #e4e8f1;
      --border: rgba(15,20,32,0.08);
      --border-strong: rgba(15,20,32,0.14);
      --text: #14192a;
      --text-soft: #5c6480;
      --text-faint: #9399b3;
      --accent: #0e9c8f;
      --accent-ink: #ffffff;
      --accent-2: #b3771c;
      --accent-2-ink: #ffffff;
      --success: #2f9e63;
      --warning: #a2760c;
      --danger: #c94c46;
      --shadow: rgba(20,25,42,0.12);
      --glass: rgba(255,255,255,0.5);
      --cat-fitness: #c15d59;
      --cat-learning: #5170b8;
      --cat-health: #5c9440;
      --cat-personal: #82609e;
      --cat-hobby: #a97c1f;
      --cat-social: #2f8b92;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f5fa;
    --surface: #ffffff;
    --surface-2: #eef1f7;
    --surface-3: #e4e8f1;
    --border: rgba(15,20,32,0.08);
    --border-strong: rgba(15,20,32,0.14);
    --text: #14192a;
    --text-soft: #5c6480;
    --text-faint: #9399b3;
    --accent: #0e9c8f;
    --accent-ink: #ffffff;
    --accent-2: #b3771c;
    --accent-2-ink: #ffffff;
    --success: #2f9e63;
    --warning: #a2760c;
    --danger: #c94c46;
    --shadow: rgba(20,25,42,0.12);
    --glass: rgba(255,255,255,0.5);
    --cat-fitness: #c15d59;
    --cat-learning: #5170b8;
    --cat-health: #5c9440;
    --cat-personal: #82609e;
    --cat-hobby: #a97c1f;
    --cat-social: #2f8b92;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; animation: none !important; } }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Rubik", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .num { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }

  ::selection { background: var(--accent); color: var(--accent-ink); }

  a { color: var(--accent); }

  svg.icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ---------- app shell ---------- */
  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
  }

  .sidebar {
    background: var(--surface);
    border-inline-end: 1px solid var(--border);
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  @media (max-width: 860px) {
    .sidebar { display: none; }
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px 22px;
  }
  .brand-mark {
    width: 32px; height: 32px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 18px; height: 18px; stroke: var(--accent-ink); stroke-width: 2.2; }
  .brand-name { font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: var(--text-soft);
    border-radius: var(--radius-s);
    font-size: 14.5px;
    font-weight: 500;
    cursor: pointer;
    text-align: right;
    transition: background 0.15s var(--ease-out), color 0.15s var(--ease-out), transform 0.1s var(--ease-out);
  }
  .nav-btn:hover { background: var(--surface-2); color: var(--text); }
  .nav-btn:active { transform: scale(0.98); }
  .nav-btn.active { background: var(--surface-2); color: var(--accent); font-weight: 600; }
  .nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .nav-spacer { flex: 1; }
  .nav-foot { font-size: 11.5px; color: var(--text-faint); padding: 10px 12px 0; }

  .bottom-nav {
    display: none;
    position: fixed;
    bottom: 0; inset-inline: 0;
    background: color-mix(in srgb, var(--surface) 86%, transparent);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    border-top: 1px solid var(--border);
    box-shadow: 0 -10px 28px -14px var(--shadow);
    padding: 7px 6px calc(7px + env(safe-area-inset-bottom));
    z-index: 30;
  }
  @media (max-width: 860px) { .bottom-nav { display: flex; justify-content: space-around; gap: 2px; } .main { padding-bottom: 82px; } }
  .bottom-nav button {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: none; border: none; color: var(--text-faint);
    font-size: 10.5px; font-weight: 500; padding: 7px 13px; border-radius: 14px; cursor: pointer;
    flex: 1; max-width: 78px;
    transition: color 0.18s var(--ease-out), background-color 0.18s var(--ease-out), transform 0.1s var(--ease-out);
  }
  .bottom-nav button svg { transition: transform 0.2s var(--ease-out); }
  @media (hover: hover) and (pointer: fine) {
    .bottom-nav button:hover { color: var(--text-soft); }
  }
  .bottom-nav button:active { transform: scale(0.9); }
  .bottom-nav button.active {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 13%, transparent);
  }
  .bottom-nav button.active svg { transform: translateY(-1px) scale(1.08); }

  .main { padding: 26px 24px 60px; max-width: 1080px; }
  @media (max-width: 560px) { .main { padding: 18px 14px 60px; } }

  .panel[hidden] { display: none; }
  .panel.panel-enter { animation: panel-in 0.32s var(--ease-out) both; }
  @keyframes panel-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-title { font-size: 24px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }
  .page-sub { color: var(--text-soft); font-size: 13.5px; margin: 4px 0 0; }

  /* ---------- cards & primitives ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-l);
    padding: 20px;
  }
  .card-tight { padding: 16px; }
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: var(--radius-s);
    padding: 10px 16px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: transform 0.12s ease, opacity 0.15s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { opacity: 0.9; }
  .btn-ghost { background: var(--surface-2); color: var(--text); }
  .btn-ghost:hover { background: var(--surface-3); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--border-strong); }
  .btn-danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .btn-icon { padding: 8px; border-radius: 50%; background: transparent; color: var(--text-soft); }
  .btn-icon:hover { background: var(--surface-2); color: var(--text); }
  .btn-sm { padding: 7px 12px; font-size: 12.5px; }
  .btn-block { width: 100%; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--text-soft); }
  .field input[type="text"], .field input[type="time"], .field select, .field textarea, .field input[type="number"] {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-s);
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    width: 100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .field textarea { resize: vertical; min-height: 60px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ---------- dashboard header ---------- */
  .hero {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    margin-bottom: 22px; flex-wrap: wrap;
  }
  .hero h1 { font-size: 26px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.01em; }
  .hero .date-line { color: var(--text-soft); font-size: 14px; }
  .clock-chip {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m);
    padding: 10px 18px; text-align: center;
  }
  .clock-chip .time { font-size: 22px; font-weight: 700; }
  .clock-chip .zone { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; }

  /* now card */
  .now-card {
    position: relative;
    background: linear-gradient(135deg, var(--surface-3), var(--surface));
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-l);
    padding: 22px;
    overflow: hidden;
  }
  .now-card::before {
    content: "";
    position: absolute; inset: -40% -20% auto auto; width: 260px; height: 260px;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%);
    pointer-events: none;
  }
  .now-label { display:flex; align-items:center; gap:7px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .now-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  .now-title { font-size: 22px; font-weight: 700; margin: 0 0 4px; position: relative; }
  .now-time { color: var(--text-soft); font-size: 13.5px; margin-bottom: 16px; position: relative; }
  .now-actions { display: flex; gap: 8px; flex-wrap: wrap; position: relative; }
  .now-empty { color: var(--text-soft); font-size: 14px; }

  .next-later-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .mini-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 13px 15px; }
  .mini-card .lbl { font-size: 10.5px; font-weight: 700; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .mini-card .ttl { font-size: 14.5px; font-weight: 600; }
  .mini-card .tm { font-size: 12px; color: var(--text-soft); }

  /* progress ring */
  .ring-wrap { display: flex; align-items: center; gap: 18px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-track { stroke: var(--surface-3); }
  .ring-fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.6s var(--ease-out); }
  .ring-pct { font-size: 24px; font-weight: 800; }
  .stat-list { display: flex; flex-direction: column; gap: 6px; }
  .stat-list .row { display: flex; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--text-soft); min-width: 150px; }
  .stat-list .row b { color: var(--text); font-weight: 600; }

  /* life balance */
  .balance-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
  .balance-row:last-child { margin-bottom: 0; }
  .balance-label { width: 108px; flex-shrink: 0; color: var(--text-soft); display: flex; align-items: center; gap: 6px; }
  .balance-track { flex: 1; height: 7px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
  .balance-fill { height: 100%; border-radius: 4px; transition: width 0.6s var(--ease-out); }
  .balance-val { width: 34px; text-align: left; color: var(--text-faint); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* schedule */
  .day-switch { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .day-pill { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); font-size: 13px; font-weight: 600; cursor: pointer; }
  .day-pill.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .day-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .day-pill-add { background: transparent; border-style: dashed; color: var(--text-faint); }
  .day-pill-add:hover { color: var(--accent); border-color: var(--accent); }
  .day-pill-wrap { position: relative; display: inline-block; }
  .day-pill-del {
    position: absolute; top: -7px; left: -7px; width: 19px; height: 19px; border-radius: 50%;
    border: 2px solid var(--surface); background: var(--danger); color: #fff; font-size: 12px; line-height: 1; padding: 0;
    cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 1;
    box-shadow: 0 1px 3px var(--shadow); z-index: 1;
  }
  .day-pill-del:hover { transform: scale(1.1); }

  .timeline { position: relative; padding-inline-start: 20px; }
  .timeline::before { content: ""; position: absolute; inset-inline-start: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
  .t-item { position: relative; padding: 0 0 18px 16px; margin-inline-start: 0; }
  .t-item:last-child { padding-bottom: 0; }
  .t-item.dragging { opacity: 0.35; }
  .t-item.drop-indicator { padding: 0; margin: -3px 0 15px 16px; height: 3px; border-radius: 2px; background: var(--accent); list-style: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .drag-handle {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 6px; border: none; background: transparent;
    color: var(--text-faint); cursor: grab; display: flex; align-items: center; justify-content: center;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  .drag-handle:hover { background: var(--surface-2); color: var(--text-soft); }
  .drag-handle:active { cursor: grabbing; }
  .t-item::before {
    content: ""; position: absolute; inset-inline-start: -19px; top: 4px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--cat, var(--accent));
  }
  .t-item.done::before { background: var(--cat, var(--accent)); }
  .t-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 11px 14px; cursor: pointer; transition: border-color 0.15s var(--ease-out), transform 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out); }
  @media (hover: hover) and (pointer: fine) {
    .t-row:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: 0 4px 14px -8px var(--shadow); }
  }
  .t-row:active { transform: scale(0.99); }
  .t-row.now { border-color: var(--cat, var(--accent)); box-shadow: 0 0 0 1px var(--cat, var(--accent)) inset; }
  .t-check { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border-strong); flex-shrink: 0; cursor: pointer; background: transparent; position: relative; }
  .t-check.done { background: var(--cat, var(--accent)); border-color: var(--cat, var(--accent)); }
  .t-check.done::after { content: ""; position: absolute; inset: 0; margin: auto; width: 5px; height: 9px; border-bottom: 2px solid var(--accent-ink); border-inline-end: 2px solid var(--accent-ink); transform: rotate(35deg) translate(-1px,-2px); }
  .t-time { font-size: 12px; color: var(--text-soft); flex: 0 0 42px; }
  .t-title { flex: 1; font-size: 14.5px; font-weight: 500; }
  .t-row.done .t-title { text-decoration: line-through; color: var(--text-faint); }
  .t-cat-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--cat, var(--accent)); flex-shrink: 0; }
  .empty-msg { text-align: center; color: var(--text-soft); padding: 30px 0; font-size: 14px; }

  /* habits */
  .habit-card { display: flex; align-items: center; gap: 14px; }
  .habit-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; background: var(--surface-2); }
  .habit-body { flex: 1; min-width: 0; }
  .habit-name { font-weight: 600; font-size: 14.5px; }
  .habit-streak { font-size: 12px; color: var(--text-soft); display: flex; align-items: center; gap: 4px; }
  .habit-toggle { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--border-strong); background: transparent; cursor: pointer; color: var(--text-soft); display:flex; align-items:center; justify-content:center; flex-shrink: 0; }
  .habit-toggle.done { background: var(--success); border-color: var(--success); color: #fff; }
  .habit-exempt-note { font-size: 11.5px; color: var(--accent); margin-top: 2px; }
  .week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .week-day { border-radius: var(--radius-s); padding: 8px 4px; text-align: center; background: var(--surface-2); border: 1px solid var(--border); }
  .week-day.is-today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .week-day .wd-name { font-size: 11px; color: var(--text-faint); margin-bottom: 4px; }
  .week-day .wd-num { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .week-day .wd-icons { display: flex; justify-content: center; gap: 3px; font-size: 12px; min-height: 16px; }
  .holiday-list { list-style: none; margin: 0; padding: 0; }
  .holiday-list li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .holiday-list li:last-child { border-bottom: none; }

  /* focus */
  .focus-wrap { display: flex; flex-direction: column; align-items: center; padding: 30px 10px; }
  .focus-ring { position: relative; width: 240px; height: 240px; }
  .focus-ring svg { transform: rotate(-90deg); }
  .focus-time { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: 700; }
  .focus-task { color: var(--text-soft); font-size: 13.5px; margin: 16px 0 4px; }
  .focus-controls { display: flex; gap: 10px; margin-top: 18px; }
  .focus-presets { display: flex; gap: 8px; margin-top: 22px; }
  .preset-btn { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text-soft); font-size: 12.5px; cursor: pointer; }
  .preset-btn.active { background: var(--surface-3); color: var(--text); border-color: var(--border-strong); }

  /* advisor */
  .advisor-intro { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }

      merged.money = Object.assign({ entries: [], savingsGoals: [], ideas: [] }, merged.money || {});

        merged.money.savingsGoals.push(Object.assign({ id: uid() }, merged.money.savingsGoal));

  function smartNowSuggestion(nnl) {
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var nextMin = nnl.next ? timeToMin(nnl.next.time) : (23 * 60 + 30);
    var freeMin = Math.max(0, nextMin - nowMin);
    var todayKey = dkey(todayDate());

    var goalWithStep = null, stepTitle = null;
    state.goals.some(function (g) {
      var step = g.milestones.filter(function (m) { return !m.done; })[0];
      if (step) { goalWithStep = g; stepTitle = step.title; return true; }
      return false;
    });
    if (freeMin >= 20 && goalWithStep) {
      return { icon: '🎯', title: stepTitle, sub: 'שלב הבא ביעד "' + goalWithStep.title + '" · ' + freeMin + ' דקות פנויות עד "' + (nnl.next ? nnl.next.title : '') + '"' };
    }

    var pendingHabit = HABITS.filter(function (h) { return !((state.habitLog[h.id] || {})[todayKey]); })[0];
    if (pendingHabit) {
      return { icon: pendingHabit.emoji, title: pendingHabit.name, sub: 'הרגל שעוד לא סימנת היום · ' + freeMin + ' דקות פנויות' };
    }
    return null;
  }

  function findFreeGaps(minMinutes) {
    var list = todayTasks();
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var upcoming = list.filter(function (t) { return timeToMin(t.time) > nowMin; })
      .sort(function (a, b) { return timeToMin(a.time) - timeToMin(b.time); });
    var sleepTask = upcoming.filter(function (t) { return /לישון|שינה/.test(t.title); })[0];
    var dayEnd = sleepTask ? timeToMin(sleepTask.time) : 23 * 60 + 30;
    var points = [nowMin];
    upcoming.forEach(function (t) { var m = timeToMin(t.time); if (m <= dayEnd) points.push(m); });
    if (points[points.length - 1] !== dayEnd) points.push(dayEnd);
    var gaps = [];
    for (var i = 0; i < points.length - 1; i++) {
      var len = points[i + 1] - points[i];
      if (len >= minMinutes) gaps.push({ start: points[i], end: points[i + 1], minutes: len });
    }
    return gaps;
  }

  function wireDragReorder(container, list) {
    if (!container) return;
    Array.prototype.forEach.call(container.querySelectorAll('.drag-handle'), function (handle) {
      handle.addEventListener('click', function (e) { e.stopPropagation(); });
      handle.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var row = handle.closest('.t-item');
        var dragId = row.dataset.id;
        row.classList.add('dragging');
        var placeholder = document.createElement('div');
        placeholder.className = 't-item drop-indicator';
        row.after(placeholder);
        try { handle.setPointerCapture(e.pointerId); } catch (err) {}

        function itemsExcludingDragged() {
          return Array.prototype.filter.call(container.querySelectorAll('.t-item'), function (it) {
            return it !== row && it !== placeholder;
          });
        }
        function onMove(ev) {
          var items = itemsExcludingDragged();
          var placed = false;
          for (var i = 0; i < items.length; i++) {
            var rect = items[i].getBoundingClientRect();
            if (ev.clientY < rect.top + rect.height / 2) {
              items[i].before(placeholder);
              placed = true;
              break;
            }
          }
          if (!placed) container.appendChild(placeholder);
        }
        function onUp(ev) {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          try { handle.releasePointerCapture(ev.pointerId); } catch (err) {}
          row.classList.remove('dragging');

          var prevEl = placeholder.previousElementSibling;
          var nextEl = placeholder.nextElementSibling;
          var prevTask = prevEl && prevEl.dataset.id ? list.find(function (t) { return t.id === prevEl.dataset.id; }) : null;
          var nextTask = nextEl && nextEl.dataset.id ? list.find(function (t) { return t.id === nextEl.dataset.id; }) : null;
          placeholder.remove();

          var dragTask = list.find(function (t) { return t.id === dragId; });
          var newMin;
          if (prevTask && nextTask) {
            var a = timeToMin(prevTask.time), b = timeToMin(nextTask.time);
            newMin = (b - a) >= 2 ? Math.round((a + b) / 2) : a + 1;
          } else if (prevTask) {
            newMin = timeToMin(prevTask.time) + 5;
          } else if (nextTask) {
            newMin = timeToMin(nextTask.time) - 5;
          } else {
            newMin = timeToMin(dragTask.time);
          }
          var newTime = minToTime(newMin);
          if (newTime !== dragTask.time) {
            dragTask.time = newTime;
            saveState();
            toast('הועבר לשעה ' + newTime);
          }
          renderSchedule();
          renderDashboard();
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    });
  }

  /* text-to-speech (Hebrew) for advisor answers */
  var speechActiveBtn = null;
  function speechSupported() { return typeof window !== 'undefined' && 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined'; }
  function pickHebrewVoice() {
    try {
      var voices = window.speechSynthesis.getVoices() || [];
      return voices.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf('he') === 0; })[0] || null;
    } catch (e) { return null; }
  }
  function resetSpeakBtn(btn) {
    if (!btn) return;
    btn.classList.remove('speaking');
    btn.innerHTML = icon('speaker');
  }
  function speakText(text, btn) {
    if (!speechSupported()) return;
    var synth = window.speechSynthesis;
    if (speechActiveBtn === btn) {
      synth.cancel();
      resetSpeakBtn(btn);
      speechActiveBtn = null;
      return;
    }
    synth.cancel();
    if (speechActiveBtn) resetSpeakBtn(speechActiveBtn);
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'he-IL';
    var voice = pickHebrewVoice();
    if (voice) utter.voice = voice;
    utter.rate = 1;
    speechActiveBtn = btn;
    btn.classList.add('speaking');
    btn.innerHTML = icon('speakerMute');
    utter.onend = function () { if (speechActiveBtn === btn) { resetSpeakBtn(btn); speechActiveBtn = null; } };
    utter.onerror = function () { if (speechActiveBtn === btn) { resetSpeakBtn(btn); speechActiveBtn = null; } };
    synth.speak(utter);
  }
  if (speechSupported() && window.speechSynthesis.onvoiceschanged !== undefined) {
    window.speechSynthesis.onvoiceschanged = function () {};
  }

  function speechRecognitionSupported() {
    return typeof window !== 'undefined' && !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  }
  var micRecognition = null;
  var micActive = false;
  function toggleVoiceInput(textareaEl, micBtn) {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR || !textareaEl || !micBtn) return;
    if (micActive && micRecognition) {
      micRecognition.stop();
      return;
    }
    var rec = new SR();
    rec.lang = 'he-IL';
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;
    micRecognition = rec;
    micActive = true;
    micBtn.classList.add('listening');
    var baseValue = textareaEl.value.trim();
    var stopped = false;
    var stop = function () {
      if (stopped) return;
      stopped = true;
      micActive = false;
      micBtn.classList.remove('listening');
      micRecognition = null;
    };
    rec.onresult = function (event) {
      var interim = '', final = '';
      for (var i = event.resultIndex; i < event.results.length; i++) {
        var res = event.results[i];
        if (res.isFinal) final += res[0].transcript;
        else interim += res[0].transcript;
      }
      textareaEl.value = (baseValue ? baseValue + ' ' : '') + final + interim;
    };
    rec.onerror = function (e) {
      stop();
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('אין הרשאה למיקרופון');
      else if (e.error !== 'aborted' && e.error !== 'no-speech') toast('לא הצלחתי להקשיב. אפשר לנסות שוב.');
    };
    rec.onend = stop;
    try { rec.start(); } catch (err) { stop(); }
  }

  function normalizeAdvice(data) {
    data = data && typeof data === 'object' ? data : {};
    var rec = ['yes', 'maybe', 'no'].indexOf(data.recommendation) >= 0 ? data.recommendation : 'maybe';
    var headline = typeof data.headline === 'string' && data.headline.trim() ? data.headline.trim() : 'קיבלתי כמה מחשבות על זה';
    var reasoning = typeof data.reasoning === 'string' ? data.reasoning.trim() : '';
    var conflicts = Array.isArray(data.conflicts) ? data.conflicts.filter(function (c) { return typeof c === 'string' && c.trim(); }) : [];
    var rawActions = Array.isArray(data.suggestedActions) ? data.suggestedActions
      : (data.suggestedAction && typeof data.suggestedAction === 'object' ? [data.suggestedAction] : []);
    var actions = rawActions.map(function (sa) {
      if (!sa || typeof sa !== 'object') return null;
      var time = typeof sa.time === 'string' && /^([01]?\d|2[0-3]):[0-5]\d$/.test(sa.time) ? sa.time : null;
      var title = typeof sa.title === 'string' && sa.title.trim() ? sa.title.trim().slice(0, 80) : null;
      var cat = CATS[sa.category] ? sa.category : 'personal';
      if (!time || !title) return null;
      return { title: title, time: time, category: cat, type: sa.type === 'daily' ? 'daily' : 'one_time' };
    }).filter(Boolean).slice(0, 12);
    return { recommendation: rec, headline: headline, reasoning: reasoning, conflicts: conflicts, actions: actions };
  }

  /* --- local rule-based reasoning: reads real app state, no network/account needed --- */
  function findPendingHabit() {
    var todayKey = dkey(todayDate());
    return HABITS.filter(function (h) { return !((state.habitLog[h.id] || {})[todayKey]); })[0] || null;
  }
  function findNextGoalStep() {
    var found = null;
    state.goals.some(function (g) {
      var step = g.milestones.filter(function (m) { return !m.done; })[0];
      if (step) { found = { goal: g, step: step }; return true; }
      return false;
    });
    return found;
  }
  function nearestExam() {
    var exams = (state.learning.exams || []).filter(function (e) { return e.date && examDaysLeft(e.date) >= 0; });
    exams.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    return exams[0] || null;
  }
  function guessCategory(text) {
    if (/אימון|כושר|ריצ[הת]|איגרוף|חד"?כ|קרדיו|שריר|ספורט|אתלטיקה|כדורגל|כדורסל|פינגפונג/.test(text)) return 'fitness';
    if (/למיד[הת]|תכנות|שיעור|לימוד|אתר|קוד|מבחן|שפ[הות]|פסיכולוגיה/.test(text)) return 'learning';
    if (/אוכל|ארוח[הת]|בריאות|לאכול|מים/.test(text)) return 'health';
    if (/פסנתר|תחביב|ציור|מוזיק[הת]/.test(text)) return 'hobby';
    if (/חבר|חברה|מפגש|יציאה/.test(text)) return 'social';
    return 'personal';
  }
  function parseTimeFromText(q) {
    var m = q.match(/([01]?\d|2[0-3]):([0-5]\d)/);
    if (!m) return null;
    var h = m[1].length === 1 ? '0' + m[1] : m[1];
    return h + ':' + m[2];
  }
  function parseDurationMinutes(q) {
    var mHour = q.match(/(\d+(?:\.\d+)?)\s*שעות?/);
    if (mHour) return Math.round(parseFloat(mHour[1]) * 60);
    var mMin = q.match(/(\d+)\s*(דקות|דק['׳]?)/);
    if (mMin) return parseInt(mMin[1], 10);
    if (/חצי שעה/.test(q)) return 30;
    return null;
  }
  function extractActivityTitle(q, timeStr) {
    var t = q;
    t = t.replace(/^אני\s+(רוצה|צריך|צריכה)\s+ל?הוסיף\s+/, '');
    t = t.replace(/^(תוסיף|תוסיפי|תקבע|תקבעי)\s+/, '');
    t = t.replace(/היום/g, '');
    if (timeStr) t = t.replace(new RegExp('ב-?' + timeStr.replace(':', '[:.]?')), '');
    t = t.replace(/[?!.]+$/, '').replace(/\s+/g, ' ').trim();
    return t || 'פעילות חדשה';
  }

  function generateAdvice(question) {
    var q = (question || '').trim();
    var now = new Date();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var list = todayTasks();
    var next = list.filter(function (t) { return timeToMin(t.time) > nowMin; })[0] || null;
    var exam = nearestExam();
    var examNote = exam ? ('יש לך מבחן ב"' + exam.title + '" בעוד ' + examDaysLeft(exam.date) + ' ימים.') : null;

    if (/עייף|עייפה|עייפים|עייפות|אין לי כוח|מותש|מותשת/.test(q)) {
      var fitLater = list.some(function (t) { return t.category === 'fitness' && timeToMin(t.time) > nowMin; });
      return {
        recommendation: fitLater ? 'maybe' : 'yes',
        headline: 'תקשיב לגוף - עייפות היא אינדיקציה אמיתית',
        reasoning: fitLater
          ? 'יש לך עוד אימון מתוכנן היום - אפשר להוריד עצימות, לקצר אותו, או להזיז אותו אם יש גמישות. שינה ומנוחה חשובות לא פחות מהאימון עצמו.'
          : 'אין לך יותר אימונים מתוכננים היום, אז זה זמן טוב למנוחה קצרה, שתיית מים, ולהקדים ללכת לישון.',
        conflicts: examNote ? [examNote] : [],
        suggestedActions: []
      };
    }

    if (/עמוס|עמוסה|לחוץ|לחוצה|יותר מדי|מה כדאי להוריד|לבטל/.test(q)) {
      var counts = {};
      list.forEach(function (t) { counts[t.category] = (counts[t.category] || 0) + 1; });
      var droppable = ['social', 'hobby', 'personal'].filter(function (c) { return counts[c] > 1; })[0];
      return {
        recommendation: 'maybe',
        headline: list.length > 14 ? 'היום באמת עמוס - שווה לגזור משהו' : 'זה לא נראה חריג מדי, אבל אפשר לפנות קצת אוויר',
        reasoning: droppable
          ? ('יש לך כמה פריטים בקטגוריית "' + CATS[droppable].label + '" - זה המקום הכי בטוח לוותר על פריט אחד או לשלב שניים ביחד, בלי לפגוע בלימודים, כושר או שינה.')
          : 'רוב מה שיש לך היום נראה חיוני (למידה, כושר, שינה) - קשה למצוא מה להוריד בלי לוותר על משהו חשוב. אולי עדיף לקצר משך זמן של כמה פריטים במקום למחוק לגמרי.',
        conflicts: examNote ? [examNote] : [],
        suggestedActions: []
      };
    }

    if (/(תבנה|בנה לי|תיצור|צור לי).*יום/.test(q)) {
      var lastYom = q.lastIndexOf('יום');
      var theme = lastYom >= 0 ? q.slice(lastYom + 3).replace(/[?!.]+$/, '').trim() : '';
      if (!theme) theme = 'מותאם אישית';
      var themedFitness = guessCategory(theme) === 'fitness';
      var base = themedFitness ? TEMPLATES.school : TEMPLATES.normal;
      var picked = base.items.filter(function (it) { return it.category !== 'personal' || /פסנתר|למידה/.test(it.title); });
      var actions = picked.slice(0, 12).map(function (it) {
        var title = (themedFitness && it.category === 'fitness') ? ('אימון ' + theme) : it.title;
        return { title: title, time: it.time, category: it.category, type: 'one_time' };
      });
      return {
        recommendation: 'yes',
        headline: 'הצעה ליום "' + theme + '"',
        reasoning: 'בניתי הצעה על בסיס מבנה יום שכבר עובד לך, עם דגש על ' + theme + '. אפשר להוסיף הכל להיום או לשמור כסוג יום חדש לשימוש עתידי.',
        conflicts: examNote ? [examNote] : [],
        suggestedActions: actions
      };
    }

    var timeStr = parseTimeFromText(q);
    if (timeStr && /(תוסיף|רוצה להוסיף|תקבע|לקבוע|להוסיף)/.test(q)) {
      var title = extractActivityTitle(q, timeStr);
      var cat = guessCategory(q);
      var conflict = list.filter(function (t) { return t.time === timeStr; })[0];
      return {
        recommendation: conflict ? 'maybe' : 'yes',
        headline: conflict ? 'יש התנגשות בשעה הזו' : ('"' + title + '" ב-' + timeStr + ' נראה סביר'),
        reasoning: conflict
          ? 'בזמן הזה כבר יש לך "' + conflict.title + '" - כדאי לבחור שעה סמוכה פנויה במקום.'
          : 'זה לא מתנגש עם שום דבר אחר היום. אם זה אימון, כדאי לוודא שיש מספיק זמן התאוששות לפני שינה.',
        conflicts: examNote ? [examNote] : [],
        suggestedActions: [{ title: title, time: timeStr, category: cat, type: 'one_time' }]
      };
    }

    var duration = parseDurationMinutes(q);
    if (/פנוי|מה כדאי לעשות|משעמם/.test(q) || duration) {
      var minutes = duration || 60;
      var gaps = findFreeGaps(Math.min(minutes, 240));
      var slot = gaps[0] || null;
      var habit = findPendingHabit();
      var goalStep = findNextGoalStep();
      var pickTitle, pickCat;
      if (goalStep) { pickTitle = goalStep.step.title; pickCat = 'personal'; }
      else if (habit) { pickTitle = habit.name; pickCat = 'health'; }
      else { pickTitle = 'זמן פנוי - קריאה, מתיחות או תחביב'; pickCat = 'personal'; }
      var startTime = slot ? minToTime(slot.start) : minToTime(nowMin);
      return {
        recommendation: slot ? 'yes' : 'maybe',
        headline: slot ? ('יש לך ' + minutes + ' דקות פנויות מ-' + startTime) : 'הלוח היום צפוף לחלון כזה',
        reasoning: goalStep
          ? ('זה זמן טוב לקדם את היעד "' + goalStep.goal.title + '" - השלב הבא הוא "' + goalStep.step.title + '".')
          : habit
          ? ('"' + habit.name + '" עוד לא סומן היום - זה זמן טוב בשבילו.')
          : 'אין הרגל דחוף או שלב יעד ממתין כרגע, אז זה זמן פנוי גמיש - תחביב, מנוחה או קריאה.',
        conflicts: (slot ? [] : ['לא מצאתי חלון פנוי של ' + minutes + ' דקות היום ברצף.']).concat(examNote ? [examNote] : []),
        suggestedActions: slot ? [{ title: pickTitle, time: startTime, category: pickCat, type: 'one_time' }] : []
      };
    }

    var todayKey = dkey(todayDate());
    var habitsDone = HABITS.filter(function (h) { return (state.habitLog[h.id] || {})[todayKey]; }).length;
    var goalStep2 = findNextGoalStep();
    var extra = goalStep2
      ? ('כשיהיה לך רגע פנוי, השלב הבא ביעד "' + goalStep2.goal.title + '" הוא "' + goalStep2.step.title + '".')
      : 'אפשר לשאול אותי משהו יותר ספציפי - זמן פנוי, עייפות, או הוספת פעילות בשעה מסוימת - ותקבל המלצה מדויקת יותר.';
    return {
      recommendation: 'maybe',
      headline: next ? ('הדבר הבא בלוח שלך: "' + next.title + '" ב-' + next.time) : 'אין עוד פריטים מתוכננים היום',
      reasoning: 'סימנת ' + habitsDone + ' מתוך ' + HABITS.length + ' הרגלים היום. ' + extra,
      conflicts: examNote ? [examNote] : [],
      suggestedActions: []
    };
  }

  function askAdvisor(question) {
    if (advisorPending) return;
    advisorPending = true;
    if (activePanel === 'advisor') renderAdvisor();
    setTimeout(function () {
      var raw;
      try { raw = generateAdvice(question); } catch (e) { raw = null; }
      advisorPending = false;
      advisorEntries.unshift({ question: question, advice: normalizeAdvice(raw) });
      if (advisorEntries.length > 30) advisorEntries.length = 30;
      saveState();
      if (activePanel === 'advisor') renderAdvisor();
    }, 450);
  }

  function renderFocus() {

    el.innerHTML = '<div class="page-head"><div><h2 class="page-title">פוקוס</h2><p class="page-sub">טיימר פומודורו למקטעי עבודה מרוכזת</p></div></div>' +

          '<circle class="ring-fill" id="focus-ring-fill" cx="120" cy="120" r="' + r + '" stroke-width="10" fill="none" stroke-dasharray="' + c + '" stroke-dashoffset="0"/>' +
        '</svg><div class="focus-time num" id="focus-time">25:00</div></div>' +

      '</div></div>';

    var ring = document.getElementById('focus-ring-fill');
    var timeEl = document.getElementById('focus-time');
    var toggleBtn = document.getElementById('focus-toggle');

    function paint() {
      var m = Math.floor(focusState.remaining / 60), s = focusState.remaining % 60;
      timeEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      var frac = focusState.remaining / focusState.total;
      ring.setAttribute('stroke-dashoffset', c - frac * c);
      toggleBtn.innerHTML = icon(focusState.running ? 'pause' : 'play') + (focusState.running ? 'השהה' : 'התחל');

    paint();

    toggleBtn.addEventListener('click', function () {
      focusState.running = !focusState.running;

        focusState.timer = setInterval(function () {
          focusState.remaining--;
          if (focusState.remaining <= 0) {
            clearInterval(focusState.timer);

      } else {
        clearInterval(focusState.timer);
      }
      paint();
    });
    document.getElementById('focus-reset').addEventListener('click', function () {
      clearInterval(focusState.timer);
      focusState.running = false;
      focusState.remaining = focusState.total;
      paint();
    });
    Array.prototype.forEach.call(el.querySelectorAll('.preset-btn'), function (b) {
      b.addEventListener('click', function () {
        clearInterval(focusState.timer);
        focusState.running = false;
        focusState.total = (+b.dataset.min) * 60;

        b.classList.add('active');
        paint();
      });
    });
  }

      '<div class="card card-tight" style="margin-bottom:12px;"><h3 style="margin-bottom:10px;">הכי טוב לכל שריר - מדע / אלופי עולם</h3><div class="tip-row">' +

  /* ================= goals ================= */
  function goalProgress(g) {
    if (g.milestones.length) {
      var done = g.milestones.filter(function (m) { return m.done; }).length;
      return Math.round(done / g.milestones.length * 100);
    }
    return g.manualProgress || 0;
  }

  function goalCardHtml(g) {
    var pct = goalProgress(g);
    var msHtml = g.milestones.map(function (m) {
      return '<li class="ms-item' + (m.done ? ' done' : '') + '">' +
        '<button class="ms-check' + (m.done ? ' done' : '') + '" data-ms-toggle="' + g.id + '|' + m.id + '">' + (m.done ? icon('check') : '') + '</button>' +
        '<span class="ms-title">' + escapeAttr(m.title) + '</span>' +
        '<button class="ms-del" data-ms-del="' + g.id + '|' + m.id + '" aria-label="מחק שלב">' + icon('x') + '</button>' +
      '</li>';
    }).join('');
    return '<div class="card goal-card">' +
      '<div class="goal-head"><h3>' + escapeAttr(g.title) + '</h3><button class="btn-icon" data-goal-del="' + g.id + '" aria-label="מחק יעד">' + icon('trash') + '</button></div>' +
      (g.targetDate ? '<div class="page-sub" style="margin-bottom:10px;">יעד ל-<span dir="ltr">' + g.targetDate + '</span></div>' : '') +
      '<div class="goal-progress-row"><div class="balance-track" style="flex:1;"><div class="balance-fill" style="width:' + pct + '%;background:var(--accent);"></div></div><span class="num" style="font-weight:700;min-width:38px;">' + pct + '%</span></div>' +
      (g.milestones.length ? '<ul class="ms-list">' + msHtml + '</ul>' : '') +
      '<div class="ms-add-row"><input type="text" class="ms-input" data-ms-input="' + g.id + '" maxlength="60" placeholder="הוסף שלב..."><button class="btn btn-ghost btn-sm" data-ms-add="' + g.id + '" aria-label="הוסף שלב">' + icon('plus') + '</button></div>' +
      (!g.milestones.length ? '<div class="goal-manual-row" style="margin-top:10px;"><span>התקדמות ידנית</span><input type="range" min="0" max="100" value="' + (g.manualProgress || 0) + '" data-manual-progress="' + g.id + '"></div>' : '') +
    '</div>';
  }

  function renderGoals() {
    var el = document.getElementById('panel-goals');
    el.innerHTML =
      '<div class="page-head"><div><h2 class="page-title">יעדים</h2><p class="page-sub">יעדים ארוכי טווח, מפורקים לשלבים קטנים</p></div>' +
        '<button class="btn btn-primary" id="add-goal-btn">' + icon('plus') + 'יעד' + '</button></div>' +
      (state.goals.length ? state.goals.map(goalCardHtml).join('') : '<p class="empty-msg">אין עדיין יעדים. תתחיל מאחד.</p>');

    document.getElementById('add-goal-btn').addEventListener('click', openNewGoalModal);
    Array.prototype.forEach.call(el.querySelectorAll('[data-goal-del]'), function (b) {
      b.addEventListener('click', function () {
        openConfirmModal('למחוק את היעד הזה?', function () {
          state.goals = state.goals.filter(function (g) { return g.id !== b.dataset.goalDel; });
          saveState(); renderGoals();
        });
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-ms-toggle]'), function (b) {
      b.addEventListener('click', function () {
        var parts = b.dataset.msToggle.split('|');
        var g = state.goals.find(function (x) { return x.id === parts[0]; });
        var m = g && g.milestones.find(function (x) { return x.id === parts[1]; });
        if (m) m.done = !m.done;
        saveState(); renderGoals();
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-ms-del]'), function (b) {
      b.addEventListener('click', function () {
        var parts = b.dataset.msDel.split('|');
        var g = state.goals.find(function (x) { return x.id === parts[0]; });
        if (g) g.milestones = g.milestones.filter(function (x) { return x.id !== parts[1]; });
        saveState(); renderGoals();
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-ms-add]'), function (b) {
      var addFn = function () {
        var input = el.querySelector('[data-ms-input="' + b.dataset.msAdd + '"]');
        var title = input.value.trim();
        if (!title) return;
        var g = state.goals.find(function (x) { return x.id === b.dataset.msAdd; });
        if (g) g.milestones.push({ id: uid(), title: title, done: false });
        saveState(); renderGoals();
      };
      b.addEventListener('click', addFn);
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-ms-input]'), function (inp) {
      inp.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        el.querySelector('[data-ms-add="' + inp.dataset.msInput + '"]').click();
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('[data-manual-progress]'), function (rng) {
      rng.addEventListener('input', function () {
        var g = state.goals.find(function (x) { return x.id === rng.dataset.manualProgress; });
        if (g) g.manualProgress = +rng.value;
        var row = rng.closest('.goal-card');
        row.querySelector('.balance-fill').style.width = rng.value + '%';
        row.querySelector('.goal-progress-row .num').textContent = rng.value + '%';
      });
      rng.addEventListener('change', function () { saveState(); });
    });
  }

  /* ================= money ================= */
  function moneyBalance() {
    return state.money.entries.reduce(function (sum, e) { return sum + (e.type === 'income' ? e.amount : -e.amount); }, 0);
  }
  function moneyMonthlyNet() {
    var ym = dkey(todayDate()).slice(0, 7);
    return state.money.entries.filter(function (e) { return e.date.slice(0, 7) === ym; })
      .reduce(function (sum, e) { return sum + (e.type === 'income' ? e.amount : -e.amount); }, 0);
  }
  function moneyEntryHtml(e) {
    var catList = e.type === 'income' ? INCOME_CATS : MONEY_CATS;
    var cat = catList.filter(function (c) { return c.id === e.category; })[0];
    var label = e.note || (cat ? cat.label : (e.type === 'income' ? 'הכנסה' : 'הוצאה'));
    return '<li class="money-entry">' +
      '<span class="em">' + (cat ? cat.emoji : (e.type === 'income' ? '💰' : '📦')) + '</span>' +
      '<div class="mt"><div>' + escapeAttr(label) + '</div><div class="cat" dir="ltr">' + e.date + (cat && e.note ? ' · ' + cat.label : '') + '</div></div>' +
      '<span class="amt num ' + e.type + '" dir="ltr">' + (e.type === 'income' ? '+' : '-') + '₪' + e.amount.toLocaleString('he-IL') + '</span>' +
      '<button class="m-del" data-money-del="' + e.id + '" aria-label="מחק">' + icon('x') + '</button>' +
    '</li>';
  }

        (sgs.length ? sgs.map(function (sg, i) {

            '<button class="btn btn-ghost btn-sm" data-add-to-savings="' + sg.id + '">' + icon('plus') + 'הוסף לחיסכון' + '</button>' +
          '</div>';
        }).join('')
        : '<p class="page-sub" style="margin:0;">עדיין אין יעד חיסכון - אפשר להוסיף כמה שרוצים.</p>') +

      b.addEventListener('click', function () {

    var input = document.getElementById(idPrefix + '-input');
    var add = function () {
      var title = input.value.trim();
      if (!title) return;
      parentObj[key].push({ id: uid(), title: title });
      saveState();
      renderLearning();
    };
    addBtn.addEventListener('click', add);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    Array.prototype.forEach.call(el.querySelectorAll('[data-' + idPrefix + '-del]'), function (b) {
      b.addEventListener('click', function () {
        var delId = b.dataset[idPrefix + 'Del'];
        parentObj[key] = parentObj[key].filter(function (i) { return i.id !== delId; });
        saveState();
        renderLearning();
      });
    });
  }
  function examDaysLeft(dateStr) {
    if (!dateStr) return null;
    var parts = dateStr.split('-');
    var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    d.setHours(0, 0, 0, 0);
    return Math.round((d - todayDate()) / 86400000);
  }
  function examMetaHtml(dateStr) {
    var days = examDaysLeft(dateStr);
    if (days === null) return '<span class="exam-meta">ללא תאריך</span>';
    var cls = days <= 2 ? 'urgent' : (days <= 7 ? 'soon' : '');
    var label = days < 0 ? 'עבר' : days === 0 ? 'היום' : days === 1 ? 'מחר' : 'עוד <bdi dir="ltr">' + days + '</bdi> ימים';
    return '<span class="exam-meta' + (cls ? ' ' + cls : '') + '">' + label + '</span>';
  }
  function examCardHtml(exams) {
    var sorted = exams.slice().sort(function (a, b) {
      if (!a.date) return 1;
      if (!b.date) return -1;
      return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
    });
    return '<div class="card" style="margin-bottom:16px;">' +
      '<h3 style="margin-bottom:10px;">📅 לוח מבחנים</h3>' +
      (sorted.length ? '<ul class="ms-list">' + sorted.map(function (it) {
        return '<li class="ms-item"><span class="ms-title">' + escapeAttr(it.title) +
          (it.date ? ' <span dir="ltr" style="color:var(--text-faint);font-size:12px;">' + it.date + '</span>' : '') + '</span>' +
          examMetaHtml(it.date) +
          '<button class="ms-del" data-exam-del="' + it.id + '" aria-label="מחק">' + icon('x') + '</button></li>';
      }).join('') + '</ul>' : '<p class="page-sub" style="margin-bottom:10px;">אין מבחנים קרובים - תוסיף אחד.</p>') +
      '<div class="exam-add-row">' +
        '<input type="text" class="ms-input" id="exam-input" maxlength="60" placeholder="למשל: מבחן במתמטיקה">' +
        '<input type="date" id="exam-date-input">' +
        '<button class="btn btn-ghost btn-sm" id="exam-add-btn">' + icon('plus') + '</button>' +
      '</div>' +
    '</div>';
  }
  function wireExamSection(el) {
    var addBtn = document.getElementById('exam-add-btn');
    var input = document.getElementById('exam-input');
    var dateInput = document.getElementById('exam-date-input');
    var add = function () {
      var title = input.value.trim();
      if (!title) return;
      state.learning.exams.push({ id: uid(), title: title, date: dateInput.value || null });
      saveState();
      renderLearning();
    };
    addBtn.addEventListener('click', add);
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    Array.prototype.forEach.call(el.querySelectorAll('[data-exam-del]'), function (b) {
      b.addEventListener('click', function () {
        state.learning.exams = state.learning.exams.filter(function (i) { return i.id !== b.dataset.examDel; });
        saveState();
        renderLearning();
      });
    });
  }
  function renderLearning() {
    var el = document.getElementById('panel-learning');
    el.innerHTML =
      '<div class="page-head"><div><h2 class="page-title">למידה</h2><p class="page-sub">שיעורי בית, שיטות למידה ולוח מבחנים</p></div></div>' +
      examCardHtml(state.learning.exams) +
      simpleListCardHtml('שיעורי בית', '📚', state.learning.homework, 'hw', 'למשל: תרגילים במתמטיקה עמ׳ 12') +
      simpleListCardHtml('שיטות למידה', '🧠', state.learning.methods, 'method', 'למשל: כרטיסיות זיכרון, פומודורו 25 דק׳');
    wireExamSection(el);
    wireSimpleListSection(el, 'hw', state.learning, 'homework');
    wireSimpleListSection(el, 'method', state.learning, 'methods');
  }

  /* ================= settings ================= */
  function renderSettings() {
    var el = document.getElementById('panel-settings');
    el.innerHTML =
      '<div class="page-head"><div><h2 class="page-title">הגדרות</h2></div></div>' +
      '<div class="card">' +
        '<div class="settings-row"><div><div class="lbl">שם</div><div class="desc">יופיע בברכת הבית</div></div>' +
          '<input type="text" id="set-name" value="' + escapeAttr(state.userName) + '" placeholder="השם שלך" style="max-width:160px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);"></div>' +
        '<div class="settings-row"><div><div class="lbl">ערכת נושא</div><div class="desc">בהיר, כהה או לפי המערכת</div></div>' +
          '<div class="seg">' +
            '<button data-theme-opt="system" class="' + (state.theme === 'system' ? 'active' : '') + '">מערכת</button>' +
            '<button data-theme-opt="light" class="' + (state.theme === 'light' ? 'active' : '') + '">בהיר</button>' +
            '<button data-theme-opt="dark" class="' + (state.theme === 'dark' ? 'active' : '') + '">כהה</button>' +
          '</div></div>' +
        '<div class="settings-row"><div><div class="lbl">ייצוא נתונים</div><div class="desc">כל המידע השמור, לגיבוי או להעברה</div></div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">' +
            '<button class="btn btn-ghost btn-sm" id="export-text-btn">' + icon('edit') + 'הצג טקסט להעתקה' + '</button>' +
          '</div></div>' +
        '<div class="settings-row"><div><div class="lbl">איפוס נתונים</div><div class="desc">מוחק את כל המשימות וההרגלים השמורים</div></div>' +
          '<button class="btn btn-danger btn-sm" id="reset-data">' + icon('trash') + 'איפוס' + '</button></div>' +
      '</div>';
    document.getElementById('set-name').addEventListener('change', function (e) { state.userName = e.target.value.trim(); saveState(); renderDashboard(); });
    document.getElementById('export-text-btn').addEventListener('click', openExportTextModal);
    Array.prototype.forEach.call(el.querySelectorAll('[data-theme-opt]'), function (b) {
      b.addEventListener('click', function () {
        state.theme = b.dataset.themeOpt; saveState(); applyTheme(); renderSettings();
      });
    });
    document.getElementById('reset-data').addEventListener('click', function () {
      openConfirmModal('לאפס את כל הנתונים השמורים? הפעולה בלתי הפיכה.', function () {
        localStorage.removeItem(STORE_KEY);
        state = loadState();
        applyTheme();
        showPanel('dashboard');
        toast('הנתונים אופסו');
      }, { title: 'איפוס נתונים', confirmLabel: 'איפוס' });
    });
  }

  /* ================= keyboard shortcuts ================= */
  document.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var map = { t: 'schedule', f: 'focus', h: 'habits', g: 'fitness' };
    if (e.key === 'n') { e.preventDefault(); showPanel('schedule'); openTaskModal(null); }
    else if (map[e.key]) { showPanel(map[e.key]); }
    else if (e.key === 'Escape') { closeModal(); }
  });

  /* ================= init ================= */
  applyTheme();
  renderNav();
  showPanel('dashboard');

  var splashEl = document.getElementById('splash');
  if (splashEl) {
    splashEl.addEventListener('click', function () {
      splashEl.style.animation = 'none';
      splashEl.style.opacity = '0';
      splashEl.style.visibility = 'hidden';
      splashEl.style.pointerEvents = 'none';
    });
  }
})();
</script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }</script>
</html>
